<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview Ícones Flashcards - Parte 3</title>
<style>
  body {
    background-color: #0D0D0D;
    color: white;
    font-family: sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 20px;
  }
  .container {
    display: flex;
    gap: 40px;
    margin-top: 30px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
  }
  .card {
    background-color: #1a1a1a;
    border: 1px solid #333;
    border-radius: 16px;
    padding: 30px;
    text-align: center;
    width: 200px;
    transition: transform 0.2s;
  }
  .card:hover {
    transform: scale(1.05);
    border-color: #36AF85;
  }
  .card h3 {
    margin: 20px 0 5px 0;
    color: #fff;
  }
  .card p {
    margin: 0;
    color: #888;
    font-size: 14px;
    line-height: 1.4;
  }
  svg {
    width: 100px;
    height: 100px;
    color: #36AF85;
  }
</style>
</head>
<body>
  <h1>Ajuste na Opção 7</h1>
  <p>Entendi! Você quer duas cartas (uma atrás da outra) e a "setinha" interagindo com elas. Veja essas 3 variações:</p>

  <div class="container">
    
    <!-- Opção 7.A -->
    <div class="card">
      <svg viewBox="0 0 24 24" fill="#1a1a1a" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 6V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2" fill="none" />
        <rect x="4" y="6" width="12" height="16" rx="2" />
        <!-- Seta abraçando a carta da frente -->
        <path d="M16 16v-2a4 4 0 0 0-4-4H8" fill="none" />
        <path d="M10 8l-2 2 2 2" fill="none" />
      </svg>
      <h3>Opção 7.A</h3>
      <p>Seta abraçando a carta da FRENTE</p>
    </div>

    <!-- Opção 7.B -->
    <div class="card">
      <svg viewBox="0 0 24 24" fill="#1a1a1a" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 6V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2" fill="none" />
        <rect x="4" y="6" width="12" height="16" rx="2" />
        <!-- Seta DENTRO da carta da frente -->
        <path d="M7 14a3 3 0 1 1 3-3" fill="none" />
        <path d="M10 8v3H7" fill="none" />
      </svg>
      <h3>Opção 7.B</h3>
      <p>Seta de "Refresh" DENTRO da carta da frente</p>
    </div>

    <!-- Opção 7.C -->
    <div class="card">
      <svg viewBox="0 0 24 24" fill="#1a1a1a" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10 6V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-2" fill="none" />
        <rect x="6" y="6" width="12" height="16" rx="2" />
        <!-- Seta que sai de trás e vai pra frente -->
        <path d="M18 16v-2a4 4 0 0 0-4-4h-4" fill="none" />
        <path d="M12 8l-2 2 2 2" fill="none" />
      </svg>
      <h3>Opção 7.C</h3>
      <p>Cartas mais centralizadas e seta abraçando a do meio</p>
    </div>

  </div>
</body>
</html>
