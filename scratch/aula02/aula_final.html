<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Induzimento a Erro Essencial e Ocultação de Impedimento · Direito Penal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#120409;
        --phone:#1d0810;
        --panel:#2e1219;
        --panel2:#250d14;
        --red:#e23e57;
        --red2:#ff8296;
        --gold:#d4af37;
        --gold2:#e9cd6d;
        --ink:#f8edef;
        --muted:#c9a7ad;
        --line:rgba(212,175,55,.3);
        --ok:#3ecf7a;
        --bad:#ff7a7a;
        color-scheme:dark;
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{
        margin:0;
        padding:0;
        font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
        background:
          radial-gradient(1100px 600px at 20% -10%, #3a0f1c 0%, transparent 60%),
          radial-gradient(900px 500px at 100% 100%, #2b0812 0%, transparent 55%),
          var(--bg);
        color:var(--ink);
        display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
        width:100vw;
        height:100vh;
        height:100dvh;
        overflow:hidden;
        scrollbar-width:none;
        -ms-overflow-style:none;
      }
      body::-webkit-scrollbar, html::-webkit-scrollbar{
        display:none;width:0;height:0;
      }
      .stage{
        display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
        width:100%;height:100%;flex:1 1 auto;min-height:0;
      }
      .phone{
        position:relative;
        width:100%;max-width:100%;min-width:0;
        height:100%;flex:1 1 auto;min-height:0;
        background:linear-gradient(180deg,#26060f 0%,var(--phone) 30%);
        display:flex;flex-direction:column;
        overflow:hidden;
        border-radius:0;border:none;box-shadow:none;
      }
      header{
        flex:0 0 auto !important;
        padding:8px 12px 6px !important;
        border-bottom:1px solid rgba(226,62,87,.25) !important;
        background:rgba(20,4,9,.97) !important;
        backdrop-filter:blur(14px);
        -webkit-backdrop-filter:blur(14px);
        width:100% !important;
        box-sizing:border-box !important;
        z-index:40 !important;
      }
      .header-wrap{
        max-width:860px;
        margin:0 auto;
        width:100%;
        box-sizing:border-box !important;
      }
      .etapa{color:var(--muted);font-size:12px;margin:0 0 5px;font-weight:600}
      .etapa b{color:var(--ink);font-weight:700}
      .track{height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-bottom:5px}
      .fill{height:100%;background:linear-gradient(90deg,#8f1020,var(--red),var(--gold));border-radius:99px;transition:width .45s ease}

      /* Área de leitura com rolagem independente suave (Sem barra de scroll) */
      .scroll{
        flex:1 1 auto !important;
        min-height:0 !important;
        overflow-y:auto !important;
        overflow-x:hidden !important;
        padding:16px 14px 20px;
        width:100%;
        box-sizing:border-box !important;
        scrollbar-width:none;
        -ms-overflow-style:none;
        overscroll-behavior:contain;
      }
      .scroll::-webkit-scrollbar{
        display:none;width:0;height:0;
      }
      .scroll > *{
        max-width:860px;
        margin-left:auto;
        margin-right:auto;
        box-sizing:border-box !important;
      }

      /* Rodapé FIXO na base da tela */
      footer{
        flex:0 0 auto !important;
        padding:8px 8px calc(8px + env(safe-area-inset-bottom)) !important;
        border-top:1px solid rgba(226,62,87,.25) !important;
        background:rgba(20,4,9,.97) !important;
        backdrop-filter:blur(16px);
        -webkit-backdrop-filter:blur(16px);
        width:100% !important;
        max-width:100% !important;
        overflow:hidden !important;
        box-sizing:border-box !important;
        z-index:40 !important;
      }
      .footer-wrap{
        max-width:860px;
        margin:0 auto;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:6px;
        width:100%;
        box-sizing:border-box !important;
      }
      .navbtn{
        flex:0 0 auto !important;
        width:auto !important;
        min-width:64px !important;
        height:42px !important;
        font-size:12px !important;
        font-weight:700 !important;
        padding:0 8px !important;
        border-radius:10px !important;
        cursor:pointer;
        display:inline-flex !important;
        align-items:center;
        justify-content:center;
        border:1px solid rgba(226,62,87,.3) !important;
        background:rgba(46,15,24,.75) !important;
        color:var(--ink) !important;
        white-space:nowrap !important;
        transition:all .15s ease;
        box-sizing:border-box !important;
      }
      .navbtn:hover{background:rgba(56,18,30,.9) !important}
      .navbtn:active{transform:scale(0.96)}
      .navbtn.next{
        background:linear-gradient(135deg,#ff7a8a,#c8102e) !important;
        border:1px solid rgba(255,255,255,.25) !important;
        color:#fff !important;
        box-shadow:0 4px 14px rgba(226,62,87,.4) !important;
      }
      .navbtn.next:hover{filter:brightness(1.1) !important}
      .navbtn:disabled{opacity:.35 !important;pointer-events:none}

      /* Player Centralizado Responsivo */
      .audio{
        flex:1 1 auto !important;
        min-width:0 !important;
        height:42px !important;
        margin:0 !important;
        background:linear-gradient(90deg,rgba(46,15,24,.92),rgba(33,10,17,.96)) !important;
        border:1px solid rgba(226,62,87,.45) !important;
        border-radius:10px !important;
        padding:3px 8px !important;
        cursor:pointer;
        display:flex !important;
        flex-direction:row !important;
        align-items:center !important;
        gap:6px !important;
        box-shadow:0 4px 14px rgba(0,0,0,.4);
        box-sizing:border-box !important;
        overflow:hidden !important;
      }
      .playbtn{
        flex:0 0 30px !important;
        width:30px !important;
        height:30px !important;
        border-radius:50% !important;
        background:linear-gradient(135deg,#ff7a8a,#c8102e) !important;
        border:1px solid rgba(255,255,255,.25) !important;
        cursor:pointer;
        display:flex !important;
        align-items:center;
        justify-content:center;
        box-shadow:0 3px 10px rgba(226,62,87,.45);
        transition:transform .15s ease;
        padding:0 !important;
      }
      .playbtn:hover{transform:scale(1.08)}
      .playbtn:active{transform:scale(0.92)}
      .playbtn svg{width:13px;height:13px;fill:#fff}

      .acontrol{
        flex:1 1 auto !important;
        min-width:0 !important;
        display:flex !important;
        flex-direction:column !important;
        justify-content:center !important;
        gap:2px !important;
        overflow:hidden !important;
        box-sizing:border-box !important;
      }
      .arow{
        display:flex !important;
        flex-direction:row !important;
        justify-content:space-between !important;
        align-items:center !important;
        width:100% !important;
        min-width:0 !important;
        margin:0 !important;
        line-height:1.1 !important;
        gap:4px !important;
      }
      .alabel{
        color:var(--red2) !important;
        font-size:9px !important;
        font-weight:700 !important;
        letter-spacing:1px !important;
        white-space:nowrap !important;
        overflow:hidden !important;
        text-overflow:ellipsis !important;
        text-transform:uppercase;
        flex:1 1 auto !important;
        min-width:0 !important;
      }
      .atime{
        color:var(--muted) !important;
        font-size:10px !important;
        font-variant-numeric:tabular-nums !important;
        font-weight:600 !important;
        white-space:nowrap !important;
        flex:0 0 auto !important;
        margin-left:auto !important;
      }
      .atrack{
        position:relative;
        width:100% !important;
        height:4px !important;
        border-radius:99px !important;
        background:rgba(255,255,255,.14) !important;
        overflow:hidden !important;
        cursor:pointer;
        margin:0 !important;
      }
      .afill{
        height:100% !important;
        width:0%;
        background:linear-gradient(90deg,var(--red),var(--gold)) !important;
        border-radius:99px !important;
        transition:width .1s linear;
      }

      @media (max-width:480px){
        header{padding:8px 10px 5px !important}
        .etapa{font-size:11px !important}
        .footer-wrap{gap:4px !important}
        .navbtn{min-width:60px !important;font-size:11px !important;padding:0 6px !important;height:38px !important}
        .audio{padding:2px 6px !important;height:38px !important}
        .playbtn{flex:0 0 28px !important;width:28px !important;height:28px !important}
        .playbtn svg{width:11px !important;height:11px !important}
        .alabel{font-size:8px !important;letter-spacing:0.5px !important}
        .atime{font-size:9.5px !important}
      }
      .banner{
        width:100%;aspect-ratio:5/2;object-fit:cover;display:block;
        border-radius:14px;border:1px solid var(--line);
        margin-bottom:16px;background:#250d14;
      }
      /* ===== CAPA: imagem primeiro, título abaixo ===== */
      .coverimg{
        width:100%;aspect-ratio:7/4.4;object-fit:cover;object-position:center 38%;display:block;
        border-radius:16px;border:1px solid var(--line);
        box-shadow:0 20px 44px rgba(0,0,0,.5),0 0 34px rgba(226,62,87,.12);
        margin-bottom:16px;background:#250d14;
      }
      .covertitle{
        font-family:"Playfair Display",Georgia,serif;font-size:36px;line-height:1.12;
        font-weight:800;margin:0 0 6px;
      }
      .coverrule{
        height:3px;width:72px;border-radius:99px;margin:12px 0 16px;
        background:linear-gradient(90deg,var(--red),var(--gold));
      }
      /* ===== IMAGEM VAZADA NO MEIO DO TEXTO ===== */
      .vazada{
        position:relative;height:138px;border-radius:14px;overflow:hidden;
        margin:16px 0;border:1px solid rgba(212,175,55,.2);background:#250d14;
      }
      .vazada img{
        width:100%;height:100%;object-fit:cover;object-position:center 40%;
        opacity:.42;display:block;
      }
      .vazada::after{
        content:"";position:absolute;inset:0;pointer-events:none;
        background:linear-gradient(180deg,rgba(29,8,16,.72),rgba(29,8,16,0) 38%,rgba(29,8,16,0) 62%,rgba(29,8,16,.72));
      }
      .scroll.enter{animation:fadein .32s ease}
      @keyframes fadein{from{opacity:.25}to{opacity:1}}
      /* ===== TERMO TÉCNICO EM DESTAQUE ===== */
      .term{color:var(--red2);font-weight:700}
      p b.term, ul.tight li b.term, .box p b.term{color:var(--red2)}
      /* ===== FRASE-CHAVE ===== */
      .frasechave{
        background:linear-gradient(160deg,rgba(226,62,87,.17),rgba(226,62,87,.05));
        border:1px solid rgba(226,62,87,.45);border-radius:14px;
        padding:14px 16px;margin:16px 0;
      }
      .frasechave .flabel{color:var(--red2);font-size:11.5px;font-weight:700;letter-spacing:1.8px;margin:0 0 6px;display:flex;align-items:center}
      .frasechave p.fq2{font-family:"Playfair Display",Georgia,serif;font-size:19px;line-height:1.45;margin:0;color:#fdf3f4}
      /* ===== CARTÃO DE FECHAMENTO DE BLOCO ===== */
      .fimbloco{
        background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:14px 16px;margin:16px 0 4px;
      }
      .fimbloco .flabel{color:var(--gold2);font-size:11.5px;font-weight:700;letter-spacing:1.8px;margin:0 0 8px;display:flex;align-items:center}
      .fimbloco ul{list-style:none;margin:0;padding:0}
      .fimbloco li{position:relative;font-size:15.5px;line-height:1.5;padding:5px 0 5px 22px;border-bottom:1px dashed rgba(255,255,255,.07)}
      .fimbloco li:last-child{border-bottom:none}
      .fimbloco li::before{content:"◆";position:absolute;left:2px;top:10px;font-size:8px;color:var(--gold)}
      .fimbloco li b{color:var(--gold2);font-weight:700}
      /* ===== ÍCONES DOS BLOCOS ESPECIAIS ===== */
      .bic{display:inline-flex;vertical-align:-2px;margin-right:7px;flex:0 0 auto}
      .bic svg{width:14px;height:14px;display:block}
      /* ===== SELO DE PROGRESSO POR BLOCO ===== */
      .sealrow{margin-top:9px}
      .blockseal{
        display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.6px;
        color:var(--gold2);border:1px solid var(--line);border-radius:99px;
        padding:4px 11px;background:rgba(212,175,55,.07);text-transform:uppercase;
      }
      .kicker{color:var(--red2);font-size:12px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;margin:0 0 6px}
      .kicker::before{content:"◆";font-size:8px;vertical-align:2px;margin-right:7px;color:var(--gold)}
      h2{font-family:"Playfair Display",Georgia,serif;font-size:25px;line-height:1.22;margin:0 0 12px;font-weight:700}
      p{font-size:16.5px;line-height:1.62;margin:0 0 12px;color:var(--ink)}
      p.lead{font-size:17.5px;color:#fdf3f4}
      ul.tight{list-style:none;margin:4px 0 14px;padding:0}
      ul.tight li{
        position:relative;font-size:16.5px;line-height:1.55;
        padding:7px 0 7px 24px;border-bottom:1px dashed rgba(255,255,255,.07);
      }
      ul.tight li:last-child{border-bottom:none}
      ul.tight li::before{content:"◆";position:absolute;left:2px;top:12px;font-size:8px;color:var(--gold)}
      ul.tight li b, p b{color:var(--gold2);font-weight:700}
      .box{
        background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:14px 16px;margin:14px 0;
      }
      .box .blabel{color:var(--red2);font-size:11.5px;font-weight:700;letter-spacing:1.8px;margin:0 0 6px}
      .box p{margin:0;font-size:15.5px}
      .box p + p{margin-top:8px}
      .box.exemplo{position:relative;overflow:hidden}
      .box.exemplo .wm{
        position:absolute;top:0;right:0;width:74%;height:100%;object-fit:cover;
        opacity:.15;mix-blend-mode:screen;pointer-events:none;
        -webkit-mask-image:linear-gradient(to left,#000 40%,transparent 96%);
        mask-image:linear-gradient(to left,#000 40%,transparent 96%);
      }
      .box.exemplo .excontent{position:relative;z-index:1}
      .viarow{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:13px 14px;margin:10px 0}
      .vianum{
        flex:0 0 auto;width:40px;height:40px;border-radius:50%;
        border:1.5px solid var(--red);color:var(--red2);
        display:flex;align-items:center;justify-content:center;
        font-family:"Playfair Display",serif;font-weight:700;font-size:16px;
      }
      .viarow h3{margin:2px 0 3px;font-size:17px;font-weight:700}
      .viarow p{margin:0;font-size:15px;color:var(--muted);line-height:1.5}
      .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
      .chip{border:1px solid var(--line);color:var(--gold2);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;background:rgba(212,175,55,.07)}
      /* .audio original migrado */
      .qtext{font-size:17.5px;line-height:1.6;margin-bottom:14px}
      .opt{
        display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
        background:var(--panel2);border:1.5px solid rgba(255,255,255,.12);color:var(--ink);
        border-radius:13px;padding:13px 14px;margin:9px 0;font-size:16px;line-height:1.45;
        font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s;
      }
      .opt:hover{border-color:rgba(226,62,87,.65)}
      .opt .letter{
        flex:0 0 auto;width:27px;height:27px;border-radius:8px;margin-top:1px;
        border:1.5px solid var(--red);color:var(--red2);
        display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
      }
      .opt.correct{border-color:var(--ok);background:rgba(62,207,122,.12)}
      .opt.correct .letter{border-color:var(--ok);color:var(--ok)}
      .opt.wrong{border-color:var(--bad);background:rgba(255,122,122,.1)}
      .opt.wrong .letter{border-color:var(--bad);color:var(--bad)}
      .opt:disabled{cursor:default;opacity:.92}
      .feedback{display:none;border-radius:13px;padding:13px 15px;margin-top:13px;font-size:15.5px;line-height:1.55}
      .feedback.show{display:block}
      .feedback.good{background:rgba(62,207,122,.13);border:1px solid rgba(62,207,122,.5)}
      .feedback.bad{background:rgba(255,122,122,.1);border:1px solid rgba(255,122,122,.45)}
      .feedback b{display:block;margin-bottom:3px;font-size:16px}
      .flashwrap{perspective:1200px;margin:6px 0 4px}
      .flash{
        position:relative;width:100%;min-height:250px;cursor:pointer;
        transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1);
      }
      .flash.flipped{transform:rotateY(180deg)}
      .face{
        position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
        border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;
      }
      .face.front{background:linear-gradient(160deg,#33121b,#200a10);border:1.5px solid var(--line);text-align:center;align-items:center}
      .face.back{background:linear-gradient(160deg,#3d1620,#2a0e16);border:1.5px solid var(--red);transform:rotateY(180deg)}
      .face .flabel{color:var(--red2);font-size:11.5px;font-weight:700;letter-spacing:2px;margin-bottom:12px}
      .face.front .fq{font-family:"Playfair Display",serif;font-size:21px;line-height:1.4}
      .face.back p{font-size:16px;line-height:1.6;margin:0}
      .face.back p b{color:var(--gold2)}
      .tap{margin-top:16px;color:var(--muted);font-size:13px}
      .matchscore{color:var(--muted);font-size:14.5px;margin-bottom:10px}
      .matchscore b{color:var(--gold2)}
      .matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
      .mbtn{
        background:var(--panel2);border:1.5px solid rgba(255,255,255,.12);color:var(--ink);
        border-radius:12px;padding:11px 11px;font-size:14.5px;line-height:1.4;font-family:inherit;
        cursor:pointer;text-align:left;transition:border-color .15s,background .15s;
      }
      .mbtn.sel{border-color:var(--red);background:rgba(226,62,87,.16)}
      .mbtn.done{border-color:var(--ok);background:rgba(62,207,122,.12);color:#c9f2da;cursor:default}
      .mbtn.shake{animation:shake .35s}
      @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
      .matchdone{display:none;margin-top:14px;background:rgba(62,207,122,.13);border:1px solid rgba(62,207,122,.5);border-radius:13px;padding:13px 15px;font-size:15.5px}
      .matchdone.show{display:block}
      table.cmp{width:100%;border-collapse:collapse;margin:8px 0 6px;font-size:14px}
      table.cmp th{
        background:#33121b;color:var(--gold2);text-align:left;padding:10px 9px;
        font-size:13px;letter-spacing:.4px;border-bottom:2px solid var(--red);
      }
      table.cmp td{padding:10px 9px;border-bottom:1px solid rgba(255,255,255,.09);line-height:1.45;vertical-align:top}
      table.cmp td.t{font-weight:700;color:var(--gold2)}
      .explorebox{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:4px 0 12px;background:#250d14}
      .explorebox img{width:100%;display:block}
      .hotspot{
        position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;
        background:rgba(20,4,9,.85);border:2px solid var(--gold);color:var(--gold2);
        font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;z-index:2;
        display:flex;align-items:center;justify-content:center;
      }
      .hotspot::after{
        content:"";position:absolute;inset:-2px;border-radius:50%;
        border:2px solid rgba(212,175,55,.8);animation:pulse 1.8s ease-out infinite;pointer-events:none;
      }
      @keyframes pulse{0%{transform:scale(1);opacity:.9}70%{transform:scale(1.7);opacity:0}100%{transform:scale(1.7);opacity:0}}
      .hotspot.active{background:linear-gradient(180deg,#ff7a8a,#c8102e);border-color:#fff;color:#fff}
      .hotspot.active::after{display:none}
      .hotspot.seen{background:var(--gold);color:#2a0e16;border-color:var(--gold2)}
      .hotspot.seen::after{animation:none;opacity:0}
      .explorecount{color:var(--muted);font-size:14.5px;margin:0 0 10px}
      .explorecount b{color:var(--gold2)}
      .hotpanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 6px}
      .hotpanel h3{margin:0 0 6px;font-size:18px;font-family:"Playfair Display",serif;font-weight:700}
      .hotpanel p{margin:0;font-size:15.5px}
      .explorehint{color:var(--muted);font-size:15px;margin:0}
      .revealcard{
        display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink);font-family:inherit;
        background:linear-gradient(160deg,#33121b,#200a10);border:1.5px solid var(--line);
        border-radius:14px;padding:15px 16px;margin:10px 0;
      }

  "narr": "O caminho desta aula. Antes de mergulhar no conteúdo, deixa eu te mostrar o caminho que vamos percorrer juntas. A aula está organizada em três blocos e um fechamento. Bloco um: primeiro, o terreno. O engano que a lei pune: o conceito do crime, o texto do artigo duzentos e trinta e seis e o erro essencial do Código Civil. Bloco dois: o artigo duzentos e trinta e seis por dentro. Impedimentos, quem responde, quem é protegido, a queixa do enganado e a condição que trava o processo penal. Bloco três: prática e fixação. Comparador, imagem para explorar, ligar termos, verdadeiro ou falso, linha do tempo e mapa mental. Fechamento: desafio final com placar e a pergunta de ouro, a mais valiosa da aula. O conteúdo vem em texto corrido, como uma conversa, e a prática fica concentrada no fim de cada bloco: questões, flashcards e atividades para fixar cada parte antes de seguir. Vamos ao primeiro bloco!",

  "titulo": "O caminho desta aula"

  "alt": "Noivo sorrindo segurando uma máscara teatral dourada que esconde metade do seu rosto",
  "corpo": "<p>Eu começo pelo coração do crime. O <b>induzimento a erro essencial</b> e a <b>ocultação de impedimento</b> tratam de uma situação muito concreta: <b>esconder do outro contraente informações que, se ele soubesse, ele não se casaria</b>. Repare na lógica: o casamento é um ato de vontade. A pessoa diz sim porque acredita estar casando com determinada pessoa, numa determinada situação. Quando esse sim é construído sobre uma informação falsa ou escondida, a vontade nasce <b>viciada</b>, e o casamento inteiro fica comprometido.</p><div class=\"box exemplo\"><img class=\"wm\" src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-penal/01-crimes-contra-a-familia/aula-02-induzimento-a-erro-essencial/imagens/mascara.webp\" alt=\"\" aria-hidden=\"true\"><div class=\"excontent\"><p class=\"blabel\">EXEMPLO PRÁTICO</p><p>A Marina vai se casar com o Thiago. O que ela não sabe é que o Thiago já foi condenado por um crime grave anos antes, e ele esconde isso dela com todo o cuidado, porque sabe que, se ela soubesse, desistiria do casamento. Depois da cerimônia, a verdade aparece. O sim da Marina foi dado <b>no escuro</b>: ela consentiu sem conhecer um fato decisivo sobre a pessoa com quem casou.</p></div></div><div class=\"frasechave\"><p class=\"flabel\">FRASE-CHAVE</p><p class=\"fq2\">Quem casa no escuro, sem saber o fato decisivo, teve a vontade roubada.</p></div><p>É esse tipo de engano que o artigo 236 transforma em crime. E ele pode acontecer de <b>dois jeitos</b> diferentes: induzindo o outro a um erro essencial ou ocultando dele um impedimento. Na próxima etapa, eu te mostro o texto da lei, palavra por palavra.</p>",

  "alt": "Livro de leis aberto na página de um artigo, com uma pena dourada e um selo de cera vermelha",
  "corpo": "<p>Chegamos ao dispositivo que comanda a aula inteira. Leia com calma, porque cada pedaço dele vira questão de prova:</p><div class=\"box\"><p class=\"blabel\">O TEXTO DA LEI</p><p>Art. 236. Contrair casamento, induzindo em erro essencial o outro contraente, ou ocultando-lhe impedimento que não seja casamento anterior. Pena: detenção, de seis meses a dois anos.</p></div><p>O caput desenha <b>duas condutas</b> alternativas. A primeira é <b>induzir em erro essencial</b>: uma conduta ativa, em que o agente faz o outro acreditar numa realidade falsa sobre a sua pessoa. A segunda é <b>ocultar um impedimento</b>: esconder do outro um fato que o Direito Civil aponta como proibição de casar. Das duas formas, o resultado é o mesmo: o outro contraente casa enganado.</p><p>Repare na parte final do caput: <b>impedimento que não seja casamento anterior</b>. Se o fato escondido for a própria condição de casado, o crime muda de nome: é <b>bigamia</b>, do artigo 235, o crime da aula anterior. O artigo 236 cuida do <b>erro essencial</b> e de <b>todos os outros impedimentos</b>, menos esse.</p><div class=\"box exemplo\"><img class=\"wm\" src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-penal/01-crimes-contra-a-familia/aula-02-induzimento-a-erro-essencial/imagens/lei.webp\" alt=\"\" aria-hidden=\"true\"><div class=\"excontent\"><p class=\"blabel\">PENSE ASSIM</p><p>A bigamia é o casamento dobrado; o artigo 236 é o casamento com a verdade escondida. Em um, sobra um casamento; no outro, <b>falta a verdade</b>.</p></div></div><p>E repare na pena: <b>detenção de seis meses a dois anos</b>, bem menor que a da bigamia, que é reclusão de dois a seis anos. A diferença de tratamento revela a diferença dos ataques: a bigamia agride a estrutura do próprio casamento; o artigo 236 agride a <b>liberdade de decidir</b> do outro contraente, que disse sim sem saber a verdade.</p>",
  "img": "lei",
  "kicker": "O texto da lei · Artigo 236",
  "narr": "O artigo duzentos e trinta e seis, palavra por palavra. Chegamos ao dispositivo que comanda a aula inteira. Leia com calma, porque cada pedaço dele vira questão de prova. O texto da lei: artigo duzentos e trinta e seis: contrair casamento, induzindo em erro essencial o outro contraente, ou ocultando-lhe impedimento que não seja casamento anterior. Pena: detenção, de seis meses a dois anos. O caput desenha duas condutas alternativas. A primeira é induzir em erro essencial: uma conduta ativa, em que o agente faz o outro acreditar numa realidade falsa sobre a sua pessoa. A segunda é ocultar um impedimento: esconder do outro um fato que o Direito Civil aponta como proibição de casar. Das duas formas, o resultado é o mesmo: o outro contraente casa enganado. Repare na parte final do caput: impedimento que não seja casamento anterior. Se o fato escondido for a própria condição de casado, o crime muda de nome: é bigamia, do artigo duzentos e trinta e cinco, o crime da aula anterior. O artigo duzentos e trinta e seis cuida do erro essencial e de todos os outros impedimentos, menos esse. Pense assim: a bigamia é o casamento dobrado; o artigo duzentos e trinta e seis é o casamento com a verdade escondida. Em um, sobra um casamento; no outro, falta a verdade. E repare na pena: detenção de seis meses a dois anos, bem menor que a da bigamia, que é reclusão de dois a seis anos. A diferença de tratamento revela a diferença dos ataques: a bigamia agride a estrutura do próprio casamento; o artigo duzentos e trinta e seis agride a liberdade de decidir do outro contraente, que disse sim sem saber a verdade.",
  "tipo": "Conteúdo",
  "titulo": "O artigo 236, palavra por palavra"
 },
 {
  "alt": "Retrato de uma pessoa dividido ao meio: de um lado a imagem idealizada, do outro a verdade revelada sob luz dourada",
  "corpo": "<p>A primeira conduta do artigo 236 é induzir o outro contraente em <b class=\"term\">erro essencial</b>. Mas atenção: não é qualquer engano. Erro essencial é um conceito do <b>Direito Civil</b>, e é lá que vamos buscar o seu significado exato:</p><div class=\"box\"><p class=\"blabel\">O TEXTO DA LEI</p><p>Art. 1.556 do Código Civil. O casamento pode ser anulado por vício da vontade, se houve por parte de um dos nubentes, ao consentir, erro essencial quanto à pessoa do outro.</p></div><p>Ou seja, o erro essencial torna o casamento <b>anulável</b>: ele é um <b>vício da vontade</b>, um defeito no consentimento de quem casa. E o artigo 1.557 do Código Civil lista o que conta como erro essencial sobre a pessoa do outro cônjuge. São <b>três hipóteses</b>:</p><div class=\"viarow\"><div class=\"vianum\">1</div><div><h3>Identidade, honra e boa fama</h3><p>O erro diz respeito à identidade, à honra e à boa fama do outro, sendo tão grave que o seu conhecimento posterior torna insuportável a vida em comum ao cônjuge enganado.</p></div></div><div class=\"viarow\"><div class=\"vianum\">2</div><div><h3>Crime anterior desconhecido</h3><p>A ignorância de crime, anterior ao casamento, que, por sua natureza, torne insuportável a vida conjugal.</p></div></div><div class=\"viarow\"><div class=\"vianum\">3</div><div><h3>Defeito físico ou moléstia grave</h3><p>A ignorância, anterior ao casamento, de defeito físico irremediável que não caracterize deficiência, ou de moléstia grave e transmissível, por contágio ou por herança, capaz de pôr em risco a saúde do outro cônjuge ou de sua descendência.</p></div></div><p>Perceba o fio que costura as três hipóteses: o fato precisa ser <b>grave</b> a ponto de tornar <b>insuportável a vida em comum</b>. Não é uma decepção qualquer do dia a dia: é um engano sobre a própria pessoa, sobre quem o outro realmente é.</p><div class=\"box exemplo\"><img class=\"wm\" src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-penal/01-crimes-contra-a-familia/aula-02-induzimento-a-erro-essencial/imagens/erro.webp\" alt=\"\" aria-hidden=\"true\"><div class=\"excontent\"><p class=\"blabel\">EXEMPLO PRÁTICO</p><p>O Rafael casou acreditando que a Camila era uma médica respeitada na cidade. Depois do casamento, descobriu que ela usava uma <b>identidade falsa</b> e respondia a processos por golpes aplicados em outras pessoas. O erro sobre a identidade, a honra e a boa fama dela, tornando insuportável a vida em comum, é o retrato da primeira hipótese do artigo 1.557.</p></div></div><div class=\"fimbloco\"><p class=\"flabel\">NESTE BLOCO VOCÊ VIU</p><ul><li><b>O crime do art. 236 nasce do engano:</b> esconder o fato que, se fosse conhecido, impediria o sim.</li><li>São duas condutas: induzir em erro essencial ou ocultar impedimento que não seja casamento anterior.</li><li>Erro essencial está no art. 1.557 do Código Civil e torna o casamento anulável.</li></ul></div>",
  "img": "erro",
  "kicker": "Erro essencial · Código Civil",

igo mil quinhentos e cinquenta e sete.",
  "tipo": "Conteúdo",
  "titulo": "Erro essencial: o engano sobre a pessoa"
 },
 {
  "alt": "Portão de ferro dourado fechado com um cadeado, diante de um caminho que leva a um altar",
  "corpo": "<p>A segunda conduta do artigo 236 é <b>ocultar um impedimento</b>. Aqui a conversa muda de figura: o <b class=\"term\">impedimento</b> não é um engano sobre qualidades da pessoa; é uma <b>proibição legal de casar</b>. Quem está impedido, simplesmente não pode casar. E, se o casamento acontece mesmo assim, ele é <b>nulo</b>.</p><div class=\"box\"><p class=\"blabel\">O TEXTO DA LEI</p><p>Art. 1.521 do Código Civil. Não podem casar: os ascendentes com os descendentes, seja o parentesco natural ou civil; os afins em linha reta; o adotante com quem foi cônjuge do adotado e o adotado com quem o foi do adotante; os irmãos, unilaterais ou bilaterais, e demais colaterais, até o terceiro grau inclusive; o adotado com o filho do adotante.</p></div><p>Vamos traduzir a lista, item por item:</p><ul class=\"tight\"><li><b>Ascendentes com descendentes:</b> pai com filha, avó com neto, seja o parentesco natural ou civil.</li><li><b>Afins em linha reta:</b> sogro com nora, sogra com genro, padrasto com enteada.</li><li><b>Adotante e adotado com os ex-cônjuges um do outro:</b> o vínculo da adoção fecha essa porta nos dois sentidos.</li><li><b>Irmãos e colaterais até o terceiro grau:</b> irmãos, sejam de pai e mãe ou de um só, tios e sobrinhos.</li><li><b>O adotado com o filho do adotante:</b> quem foi adotado não pode casar com o filho de quem o adotou.</li></ul><p>Repare que a lista é feita de <b>parentescos e vínculos</b>: são situações em que o ordenamento fecha a porta do casamento por completo, para proteger a estrutura da família.</p><div class=\"frasechave\"><p class=\"flabel\">FRASE-CHAVE</p><p class=\"fq2\">Erro essencial torna o casamento anulável; impedimento torna o casamento nulo.</p></div><p>E o efeito do impedimento é o mais forte do Direito Civil de família: o casamento celebrado com impedimento é <b>nulo</b>, como diz o artigo 1.548 do Código Civil. Guarde esse contraste, porque ele decide casos inteiros.</p><div class=\"box exemplo\"><img class=\"wm\" src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-penal/01-crimes-contra-a-familia/aula-02-induzimento-a-erro-essencial/imagens/impedimento.webp\" alt=\"\" aria-hidden=\"true\"><div class=\"excontent\"><p class=\"blabel\">EXEMPLO PRÁTICO</p><p>O Eduardo conheceu a Sônia e os dois se apaixonaram. O que a Sônia não sabia é que o Eduardo é <b>irmão dela por parte de pai</b>, fato que ele conhecia e escondeu. Irmãos não podem casar: existe impedimento. Ao ocultá-lo e contrair o casamento, o Eduardo pratica a segunda conduta do artigo 236.</p></div></div>",
  "img": "impedimento",
  "kicker": "Impedimento · Artigo 1.521 do Código Civil",
  "narr": "Impedimento: o casamento que a lei proíbe. A segunda conduta do artigo duzentos e trinta e seis é ocultar um impedimento. Aqui a conversa muda de figura: o impedimento não é um engano sobre qualidades da pessoa; é uma proibição legal de casar. Quem está impedido, simplesmente não pode casar. E, se o casamento acontece mesmo assim, ele é nulo. O texto da lei: artigo mil quinhentos e vinte e um do Código Civil: não podem casar: os ascendentes com os descendentes, seja o parentesco natural ou civil; os afins em linha reta; o adotante com quem foi cônjuge do adotado e o adotado com quem o foi do adotante; os irmãos, unilaterais ou bilaterais, e demais colaterais, até o terceiro grau inclusive; o adotado com o filho do adotante. Vamos traduzir a lista, item por item. Ascendentes com descendentes: pai com filha, avó com neto, seja o parentesco natural ou civil. Afins em linha reta: sogro com nora, sogra com genro, padrasto com enteada. Adotante e adotado com os ex-cônjuges um do outro: o vínculo da adoção fecha essa porta nos dois sentidos. Irmãos e colaterais até o terceiro grau: irmãos, sejam de pai e mãe ou de um só, tios e sobrinhos. O adotado com o filho do adotante: quem foi adotado não pode casar com o filho de quem o adotou. Repare que a lista é feita de parentescos e vínculos: são situações em que o ordenamento fecha a porta do casamento por completo, para proteger a estrutura da família. Erro essencial torna o casamento anulável; impedimento torna o casamento nulo. E o efeito do impedimento é o mais forte do Direito Civil de família: o casamento celebrado com impedimento é nulo, como diz o artigo mil quinhentos e quarenta e oito do Código Civil. Guarde esse contraste, porque ele decide casos inteiros. Exemplo prático: o Eduardo conheceu a Sônia e os dois se apaixonaram. O que a Sônia não sabia é que o Eduardo é irmão dela por parte de pai, fato que ele conhecia e escondeu. Irmãos não podem casar: existe impedimento. Ao ocultá-lo e contrair o casamento, o Eduardo pratica a segunda conduta do artigo duzentos e trinta e seis.",
  "tipo": "Conteúdo",
  "titulo": "Impedimento: o casamento que a lei proíbe"
 },

  "alt": "Duas silhuetas frente a frente num cartório, uma delas com um documento escondido atrás das costas",
  "corpo": "<p>Vamos organizar as pessoas desse crime. O <b>sujeito ativo</b>, quem pratica o delito, é <b>aquele que se encontra impedido ou em erro essencial</b>: a pessoa que carrega a situação escondida, ou provoca o engano, e mesmo assim contrai o casamento.</p><p>E repare num ponto que as bancas adoram: é possível que <b>ambos os nubentes cometam o delito ao mesmo tempo</b>. Imagine duas pessoas, cada uma escondendo da outra um fato decisivo: as duas induzem, as duas ocultam, e as duas respondem pelo artigo 236.</p><p>Quem a lei protege? O <b>sujeito passivo</b> é duplo, como na bigamia: o <b>Estado</b>, guardião da ordem jurídica da família, e o <b>nubente de boa-fé</b>, o contraente enganado, que disse sim sem conhecer a verdade.</p><p>Por fim, o elemento subjetivo: é o <b class=\"term\">dolo</b> de contrair o casamento com induzimento ou ocultação. O agente precisa <b>querer casar</b> e <b>saber</b> que está enganando ou escondendo. Sem essa consciência, não há o crime: quem ignora o próprio impedimento, sem saber que ele existe, não age com o dolo que o artigo 236 exige.</p><div class=\"frasechave\"><p class=\"flabel\">FRASE-CHAVE</p><p class=\"fq2\">Responde quem esconde; a lei protege o Estado e o nubente de boa-fé.</p></div><div class=\"box exemplo\"><img class=\"wm\" src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-penal/01-crimes-contra-a-familia/aula-02-induzimento-a-erro-essencial/imagens/sujeitos.webp\" alt=\"\" aria-hidden=\"true\"><div class=\"excontent\"><p class=\"blabel\">EXEMPLO PRÁTICO</p><p>A Patrícia sabia que tinha uma <b>moléstia grave e transmissível</b> e escondeu esse fato do noivo, o André, até depois da cerimônia. Ela é a sujeito ativo do crime: guardou para si um fato que configura erro essencial sobre a sua pessoa. O André, de boa-fé, é sujeito passivo, ao lado do Estado.</p></div></div>",

  "kicker": "Sujeitos e elemento subjetivo",
  "narr": "Quem responde e quem a lei protege. Vamos organizar as pessoas desse crime. O sujeito ativo, quem pratica o delito, é aquele que se encontra impedido ou em erro essencial: a pessoa que carrega a situação escondida, ou provoca o engano, e mesmo assim contrai o casamento. E repare num ponto que as bancas adoram: é possível que ambos os nubentes cometam o delito ao mesmo tempo. Imagine duas pessoas, cada uma escondendo da outra um fato decisivo: as duas induzem, as duas ocultam, e as duas respondem pelo artigo duzentos e trinta e seis. Quem a lei protege? O sujeito passivo é duplo, como na bigamia: o Estado, guardião da ordem jurídica da família, e o nubente de boa-fé, o contraente enganado, que disse sim sem conhecer a verdade. Por fim, o elemento subjetivo: é o dolo de contrair o casamento com induzimento ou ocultação. O agente precisa querer casar e saber que está enganando ou escondendo. Sem essa consciência, não há o crime: quem ignora o próprio impedimento, sem saber que ele existe, não age com o dolo que o artigo duzentos e trinta e seis exige. Responde quem esconde; a lei protege o Estado e o nubente de boa-fé. Exemplo prático: a Patrícia sabia que tinha uma moléstia grave e transmissível e escondeu esse fato do noivo, o André, até depois da cerimônia. Ela é a sujeito ativo do crime: guardou para si um fato que configura erro essencial sobre a sua pessoa. O André, de boa-fé, é sujeito passivo, ao lado do Estado.",

  "corpo": "<p>Agora presta atenção, porque o <b>parágrafo único</b> do artigo 236 guarda as regras mais cobradas do crime inteiro. A primeira delas trata de <b>quem pode acusar</b>:</p><div class=\"box\"><p class=\"blabel\">O TEXTO DA LEI</p><p>Art. 236, parágrafo único. A ação penal depende de queixa do contraente enganado e não pode ser intentada senão depois de transitar em julgado a sentença que, por motivo de erro ou impedimento, anule o casamento.</p></div><p>Primeira regra: a ação penal é <b>privada</b>. Só o <b>contraente enganado</b> pode dar o primeiro passo, oferecendo a <b class=\"term\">queixa</b>. Não é o Ministério Público quem decide começar esse processo: é a própria vítima, e somente ela.</p><p>E essa ação é <b>privada personalíssima</b>: ela pertence à pessoa do enganado e a mais ninguém. Por ser personalíssima, ela <b>não se transmite</b> ao cônjuge, ao ascendente, ao descendente ou ao irmão, <b>nem mesmo por herança</b>. Se o contraente enganado morre, a <b>punibilidade se extingue</b>: ninguém pode continuar o processo no lugar dele.</p><div class=\"box exemplo\"><img class=\"wm\" src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-penal/01-crimes-contra-a-familia/aula-02-induzimento-a-erro-essencial/imagens/queixa.webp\" alt=\"\" aria-hidden=\"true\"><div class=\"excontent\"><p class=\"blabel\">PENSE ASSIM</p><p>É como uma chave que só existe em <b>um único bolso</b>. A queixa do artigo 236 não passa de mão em mão: se a pessoa que a carrega sai de cena, a porta do processo penal simplesmente não se abre mais.</p></div></div><div class=\"frasechave\"><p class=\"flabel\">FRASE-CHAVE</p><p class=\"fq2\">Só o enganado acusa, e essa acusação não se herda.</p></div>",
  "img": "queixa",
  "kicker": "Ação penal · Parágrafo único",
  "narr": "A ação penal nas mãos do enganado. Agora presta atenção, porque o parágrafo único do artigo duzentos e trinta e seis guarda as regras mais cobradas do crime inteiro. A primeira delas trata de quem pode acusar. O texto da lei: artigo duzentos e trinta e seis, parágrafo único: a ação penal depende de queixa do contraente enganado e não pode ser intentada senão depois de transitar em julgado a sentença que, por motivo de erro ou impedimento, anule o casamento. Primeira regra: a ação penal é privada. Só o contraente enganado pode dar o primeiro passo, oferecendo a queixa. Não é o Ministério Público quem decide começar esse processo: é a própria vítima, e somente ela. E essa ação é privada personalíssima: ela pertence à pessoa do enganado e a mais ninguém. Por ser personalíssima, ela não se transmite ao cônjuge, ao ascendente, ao descendente ou ao irmão, nem mesmo por herança. Se o contraente enganado morre, a punibilidade se extingue: ninguém pode continuar o processo no lugar dele. Pense assim: é como uma chave que só existe em um único bolso. A queixa do artigo duzentos e trinta e seis não passa de mão em mão: se a pessoa que a carrega sai de cena, a porta do processo penal simplesmente não se abre mais. Só o enganado acusa, e essa acusação não se herda.",
  "tipo": "Conteúdo",
  "titulo": "A ação penal nas mãos do enganado"
 },
 {
  "alt": "Martelo de juiz pousado sobre uma sentença com carimbo dourado, diante de cortinas de tribunal",
  "corpo": "<p>A segunda regra do parágrafo único é uma <b>trava de tempo</b>: a queixa não pode ser oferecida a qualquer momento. Ela só pode ser intentada <b>depois de transitar em julgado</b> a sentença que, por motivo de erro ou impedimento, <b>anule o casamento</b>.</p><p><b class=\"term\">Trânsito em julgado</b> é o momento em que a sentença não admite mais recurso e se torna definitiva. Essa sentença é o que chamamos de <b>condição de procedibilidade</b>: sem ela, o processo penal nem pode começar. Primeiro o Direito Civil desfaz o casamento viciado; só depois o Direito Penal entra em cena.</p><p>Duas consequências práticas nascem daí. A primeira: a <b>prescrição</b> só começa a correr da <b>sentença que decreta a nulidade do matrimônio</b>, porque é ali que a porta do processo se abre. A segunda, sustentada pela doutrina: é <b>impossível a tentativa</b> nesse crime, justamente porque a punição está amarrada a esse caminho prévio da anulação.</p><div class=\"box exemplo\"><img class=\"wm\" src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-penal/01-crimes-contra-a-familia/aula-02-induzimento-a-erro-essencial/imagens/sentenca.webp\" alt=\"\" aria-hidden=\"true\"><div class=\"excontent\"><p class=\"blabel\">EXEMPLO PRÁTICO</p><p>A Beatriz descobriu, um ano depois de casada, que o marido havia ocultado um crime anterior gravíssimo. A vontade dela era processá-lo criminalmente na mesma semana. <b>Não pode</b>: primeiro, ela precisa da ação civil de anulação do casamento. Só quando a sentença que anula o casamento transitar em julgado é que a queixa pelo artigo 236 pode ser oferecida, e é dessa sentença que a prescrição começa a contar.</p></div></div><div class=\"frasechave\"><p class=\"flabel\">FRASE-CHAVE</p><p class=\"fq2\">Primeiro anula o casamento; só depois, e pelo enganado, nasce o processo penal.</p></div>",
  "img": "sentenca",

  "alt": "Alvo dourado com flechas e uma lupa revelando armadilhas sobre um pergaminho",
  "corpo": "<p>Antes de fechar o conteúdo, eu separei as <b>cinco confusões</b> que mais derrubam candidatos neste tema. Grave cada uma:</p><div class=\"box\"><p class=\"blabel\">PEGADINHA 1 · CASAMENTO ANTERIOR NÃO É ARTIGO 236</p><p>Ocultar que já é casado <b>não</b> é o crime desta aula. O caput do artigo 236 diz impedimento <b>que não seja casamento anterior</b>: casar sendo casado é <b>bigamia</b>, do artigo 235.</p></div><div class=\"box\"><p class=\"blabel\">PEGADINHA 2 · AÇÃO PENAL NÃO É PÚBLICA</p><p>Nada de ação pública incondicionada. O artigo 236 depende de <b>queixa do contraente enganado</b>: quem aciona o processo penal é a vítima, e só ela.</p></div><div class=\"box\"><p class=\"blabel\">PEGADINHA 3 · QUEIXA ANTES DA ANULAÇÃO NÃO ANDA</p><p>A queixa oferecida <b>antes</b> do trânsito em julgado da sentença que anula o casamento é prematura. A sentença é <b>condição de procedibilidade</b>: sem ela, o processo nem começa.</p></div><div class=\"vazada\" aria-hidden=\"true\"><img src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-penal/01-crimes-contra-a-familia/aula-02-induzimento-a-erro-essencial/imagens/pegadinhas.webp\" alt=\"\"></div><div class=\"box\"><p class=\"blabel\">PEGADINHA 4 · NÃO É QUALQUER DECEPÇÃO</p><p>Erro essencial não é qualquer mentira do namoro. Ele precisa se encaixar no artigo 1.557 do Código Civil e ser grave a ponto de tornar <b>insuportável</b> a vida em comum.</p></div><div class=\"box\"><p class=\"blabel\">PEGADINHA 5 · A QUEIXA NÃO SE HERDA</p><p>A ação é <b>personalíssima</b>: não passa para cônjuge, ascendente, descendente ou irmão, nem por herança. A morte da vítima <b>extingue a punibilidade</b>.</p></div>",

    function bindAudio(){
      var playBtn = document.getElementById("playBtn");
      var box = document.getElementById("audioBox");
      var track = document.getElementById("aTrack");

      function onPlayToggle(ev){
        if(ev){ ev.stopPropagation(); ev.preventDefault(); }
        unlocked = true;
        togglePlay();
      }

      playBtn.addEventListener("click", onPlayToggle);
      playBtn.addEventListener("touchend", onPlayToggle);

      function onSeek(ev){
        if(ev){ ev.stopPropagation(); }
        var r = track.getBoundingClientRect();
        var clientX = ev.clientX;
        if(clientX === undefined && ev.touches && ev.touches[0]){
          clientX = ev.touches[0].clientX;
        }
        if(player.duration && r.width > 0 && clientX !== undefined){
          var pct = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
          player.currentTime = player.duration * pct;
        }
      }

      track.addEventListener("click", onSeek);
      track.addEventListener("touchstart", onSeek);
    }

    function tryPlay(){
      var p = player.play();
      if(p && p.catch){ p.catch(function(){}); }
    }
    function togglePlay(){
      if(player.paused){ tryPlay(); } else { player.pause(); }
    }

    player.addEventListener("play", function(){
      var b = document.getElementById("playBtn");
      if(b) b.innerHTML = ICON_PAUSE;
    });
    player.addEventListener("pause", function(){
      var b = document.getElementById("playBtn");
      if(b) b.innerHTML = ICON_PLAY;
    });
    player.addEventListener("timeupdate", function(){
      var f = document.getElementById("aFill");
      var t = document.getElementById("aTime");
      if(f && player.duration) f.style.width = (100 * player.currentTime / player.duration) + "%";
      if(t && player.duration) t.textContent = fmt(player.currentTime) + " / " + fmt(player.duration);
      karaSync();
    });
    player.addEventListener("loadedmetadata", function(){
      var t = document.getElementById("aTime");
      if(t && player.duration) t.textContent = "0:00 / " + fmt(player.duration);
    });
    player.addEventListener("ended", function(){
      var f = document.getElementById("aFill");
      if(f) f.style.width = "0%";
    });

    function bindInteractions(s){
      if(s.tipo === "Questão" || s.tipo === "Questão de banca"){
        var answered = state[idx] && state[idx].answered;
        var opts = scrollArea.querySelectorAll(".opt");
        var fb = document.getElementById("feedback");
        function paint(chosen){
          opts.forEach(function(o){
            var oi = parseInt(o.getAttribute("data-opt"), 10);
            o.disabled = true;
            if(oi === s.certa) o.classList.add("correct");
            else if(oi === chosen) o.classList.add("wrong");
          });
          fb.className = "feedback show " + (chosen === s.certa ? "good" : "bad");
          fb.innerHTML = "<b>" + (chosen === s.certa ? "Resposta certa!" : "Não foi dessa vez.") + "</b>" + s.feedback;
        }
        if(answered){ paint(state[idx].chosen); }
        opts.forEach(function(o){
          o.addEventListener("click", function(){
            if(state[idx] && state[idx].answered) return;
            var oi = parseInt(o.getAttribute("data-opt"), 10);
            state[idx] = {answered:true, chosen:oi};
            paint(oi);
          });

      } else if(s.tipo === "Ligar termos"){
        var st = state[idx];

        var defs = scrollArea.querySelectorAll(".def");
        function select(el, group){
          if(el.classList.contains("done")) return;
          var groupBtns = group === "t" ? terms : defs;
          groupBtns.forEach(function(b){ b.classList.remove("sel"); });
          el.classList.add("sel");
          if(group === "t") st.selT = parseInt(el.getAttribute("data-term"), 10);
          else st.selD = parseInt(el.getAttribute("data-def"), 10);

        function checkMatch(){
          if(st.selT === null || st.selT === undefined || st.selD === null || st.selD === undefined) return;
          var tBtn = scrollArea.querySelector('.term[data-term="' + st.selT + '"]');
          var dBtn = scrollArea.querySelector('.def[data-def="' + st.selD + '"]');
          if(st.selT === st.selD){
            st.done[st.selT] = true;
            st.count++;
            tBtn.classList.add("done"); dBtn.classList.add("done");
            tBtn.classList.remove("sel"); dBtn.classList.remove("sel");
            var mc = document.getElementById("matchCount");

          card.addEventListener("touchstart", function(ev){ ev.stopPropagation(); }, {passive:true});

          var startX = null, dx = 0;
          var stampF = document.getElementById("stampF");
          var stampV = document.getElementById("stampV");
          card.addEventListener("pointerdown", function(ev){
            startX = ev.clientX; dx = 0;

          card.addEventListener("pointermove", function(ev){
            if(startX === null) return;

            if(stampV) stampV.style.opacity = dx > 12 ? Math.min(1, dx / 80) : 0;

          card.addEventListener("pointerup", function(){

            startX = null;

            if(stampV) stampV.style.opacity = 0;
            if(stampF) stampF.style.opacity = 0;
            if(finalDx > 70) answerVF(true);

        box.addEventListener("touchstart", function(ev){ ev.stopPropagation(); }, {passive:true});

        var cmpDrag = false;
        function cmpFromEvent(ev){
          var r = box.getBoundingClientRect();
          setCmp((ev.clientX - r.left) / r.width * 100);

        box.addEventListener("pointerdown", function(ev){ cmpDrag = true; try{ box.setPointerCapture(ev.pointerId); }catch(e){} cmpFromEvent(ev); });
        box.addEventListener("pointermove", function(ev){ if(cmpDrag) cmpFromEvent(ev); });

    var karaIdx = -1;
    function karaFracs(s){
      var totalChars = 0;
      s.frases.forEach(function(f){ totalChars += f.length; });
      var acc = 0, fr = [];
      s.frases.forEach(function(f){
        fr.push([acc / totalChars, (acc + f.length) / totalChars]);
        acc += f.length;
      });
      return fr;
    }
    function karaSync(){
      var s = SLIDES[idx];
      if(!s || s.tipo !== "Karaokê" || !player.duration) return;
      var box = document.getElementById("karaokeBox");
      if(!box) return;
      var fr = karaFracs(s);
      var pos = player.currentTime / player.duration;
      var cur = 0;
      for(var i = 0; i < fr.length; i++){ if(pos >= fr[i][0]) cur = i; }
      if(cur === karaIdx) return;
      karaIdx = cur;
      var spans = box.querySelectorAll(".sent");
      spans.forEach(function(sp, si){
        sp.classList.toggle("on", si === cur);
        sp.classList.toggle("done", si < cur);
      });
      var el = spans[cur];
      if(el) el.scrollIntoView({behavior:"smooth", block:"nearest"});
    }
    function karaSeek(fi){
      var s = SLIDES[idx];
      if(!s || s.tipo !== "Karaokê" || !player.duration) return;
      var fr = karaFracs(s);
      player.currentTime = Math.max(0, fr[fi][0] * player.duration - 0.05);
      karaIdx = -1;
      karaSync();
      unlocked = true;
      tryPlay();
    }

    var BLOCKS = [[4,"Bloco 1 de 3 · A verdade no casamento"],[16,"Bloco 2 de 3 · O artigo 236 por dentro"],[28,"Bloco 3 de 3 · Prática e fixação"],[31,"Fechamento"]];
    function blockLabel(i){
      for(var b = 0; b < BLOCKS.length; b++){ if(i <= BLOCKS[b][0]) return BLOCKS[b][1]; }
      return "Fechamento";
    }

    function show(i, autoplay){
      idx = Math.max(0, Math.min(total - 1, i));
      var s = SLIDES[idx];
      karaIdx = -1;
      scrollArea.innerHTML = slideHTML(s);
      scrollArea.scrollTop = 0; try { window.scrollTo({ top: 0, behavior: "instant" }); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } catch(e){}
      scrollArea.classList.remove("enter");
      void scrollArea.offsetWidth;
      scrollArea.classList.add("enter");
      var h1El = document.querySelector("header h1");
      if(h1El) h1El.style.display = idx === 0 ? "none" : "";
      var seal = document.getElementById("blockSeal");
      if(seal) seal.textContent = blockLabel(idx);
      etapaLabel.innerHTML = "Etapa <b>" + (idx + 1) + " de " + total + "</b> · " + s.tipo + (s.titulo ? ": " + s.titulo : "");
      progressFill.style.width = ((idx + 1) / total * 100) + "%";
      btnPrev.disabled = idx === 0;
      btnNext.innerHTML = idx === total - 1 ? "↺ Voltar ao início" : "Próximo →";
      bindInteractions(s);
      player.pause();
      player.src = audioSrc(idx);
      player.load();
      if(autoplay && unlocked){ tryPlay(); }
    }

    btnPrev.addEventListener("click", function(){ show(idx - 1, true); });
    btnNext.addEventListener("click", function(){
      if(idx === total - 1){ show(0, true); } else { show(idx + 1, true); }
    });
    document.addEventListener("keydown", function(ev){
      if(ev.key === "ArrowRight"){ btnNext.click(); }
      else if(ev.key === "ArrowLeft"){ btnPrev.click(); }
    });
    document.addEventListener("pointerdown", function(){
      if(!unlocked){
        unlocked = true;
        if(player.paused){ tryPlay(); }
      }
    }, {once:false});

    var tx = null, ty = null;
    var phone = document.getElementById("phone");
    phone.addEventListener("touchstart", function(ev){
      tx = ev.touches[0].clientX; ty = ev.touches[0].clientY;
    }, {passive:true});
    phone.addEventListener("touchend", function(ev){
      if(tx === null) return;
      var dx = ev.changedTouches[0].clientX - tx;
      var dy = ev.changedTouches[0].clientY - ty;
      if(Math.abs(dx) > 64 && Math.abs(dx) > Math.abs(dy) * 1.7){
        if(dx < 0){ btnNext.click(); } else { btnPrev.click(); }
      }
      tx = null; ty = null;
    }, {passive:true});

    bindAudio();
    show(0, false);
    </script>
  </body>
</html>
