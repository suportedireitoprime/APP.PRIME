name: Sync STF Pautas

on:
  repository_dispatch:
    types: [sync_stf_pautas]
  workflow_dispatch: # Permite execução manual

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 supabase
        
    - name: Run STF Scraper
      env:
        SUPABASE_URL: ${{ github.event.client_payload.supabase_url || secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ github.event.client_payload.supabase_key || secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: python stf_scraper.py
