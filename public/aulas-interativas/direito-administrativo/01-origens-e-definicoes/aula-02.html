<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <base href="/" />
    <link rel="icon" href="data:," />
    <title>Definições do Direito Administrativo · Direito Administrativo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>

      :root{
        --bg:#140e02;
        --phone:#1d1508;
        --panel:#2e2410;
        --panel2:#251a0a;
        --red:#d9a00a;
        --red2:#ffe38a;
        --gold:#d4af37;
        --gold2:#e9cd6d;
        --ink:#fdf6e3;
        --muted:#c9b083;
        --line:rgba(212,175,55,.3);
        --ok:#3ecf7a;
        --bad:#ff7a7a;
        color-scheme:dark;
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{
        margin:0;
        padding:0;
        font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
        background:
          radial-gradient(1100px 600px at 20% -10%, #3a2808 0%, transparent 60%),
          radial-gradient(900px 500px at 100% 100%, #2b1d06 0%, transparent 55%),
          var(--bg);
        color:var(--ink);
        display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
        width:100vw;
        height:100vh;
        height:100dvh;
        overflow:hidden;
        scrollbar-width:none;
        -ms-overflow-style:none;
      }
      body::-webkit-scrollbar, html::-webkit-scrollbar{
        display:none;width:0;height:0;
      }
      .stage{
        display:flex;flex-direction:column;align-items:stretch;justify-content:flex-start;
        width:100%;height:100%;flex:1 1 auto;min-height:0;
      }
      .phone{
        position:relative;
        width:100%;max-width:100%;min-width:0;
        height:100%;flex:1 1 auto;min-height:0;
        background:linear-gradient(180deg,#261c06 0%,var(--phone) 30%);
        display:flex;flex-direction:column;
        overflow:hidden;
        border-radius:0;border:none;box-shadow:none;
      }
      header{
        flex:0 0 auto !important;
        padding:calc(14px + env(safe-area-inset-top, 0px)) 16px 10px !important;
        border-bottom:1px solid rgba(217,160,10,.25) !important;
        background:rgba(20,14,2,.98) !important;
        backdrop-filter:blur(14px);
        -webkit-backdrop-filter:blur(14px);
        width:100% !important;
        box-sizing:border-box !important;
        z-index:40 !important;
      }
      .header-wrap{
        max-width:860px;
        margin:0 auto;
        width:100%;
        box-sizing:border-box !important;
      }
      .etapa{color:var(--muted);font-size:12px;margin:0 0 5px;font-weight:600}
      .etapa b{color:var(--ink);font-weight:700}
      .track{height:4px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;margin-bottom:5px}
      .fill{height:100%;background:linear-gradient(90deg,#8f1020,var(--red),var(--gold));border-radius:99px;transition:width .45s ease}

      /* Área de leitura com rolagem independente suave (Sem barra de scroll) */
      .scroll{
        flex:1 1 auto !important;
        min-height:0 !important;
        overflow-y:auto !important;
        overflow-x:hidden !important;
        padding:16px 14px 20px;
        width:100%;
        box-sizing:border-box !important;
        scrollbar-width:none;
        -ms-overflow-style:none;
        overscroll-behavior:contain;
      }
      .scroll::-webkit-scrollbar{
        display:none;width:0;height:0;
      }
      .scroll > *{
        max-width:860px;
        margin-left:auto;
        margin-right:auto;
        box-sizing:border-box !important;
      }

      /* Rodapé FIXO na base da tela */
      footer{
        flex:0 0 auto !important;
        padding:12px 14px calc(24px + env(safe-area-inset-bottom, 24px)) !important;
        border-top:1px solid rgba(217,160,10,.3) !important;
        background:rgba(20,14,2,.98) !important;
        backdrop-filter:blur(18px);
        -webkit-backdrop-filter:blur(18px);
        width:100% !important;
        max-width:100% !important;
        overflow:hidden !important;
        box-sizing:border-box !important;
        z-index:40 !important;
      }
      .footer-wrap{
        max-width:860px;
        margin:0 auto;
        display:flex;
        align-items:center;
        justify-content:space-between;
        gap:10px;
        width:100%;
        box-sizing:border-box !important;
      }
      .navbtn{
        flex:0 0 auto !important;
        width:auto !important;
        min-width:88px !important;
        height:54px !important;
        font-size:13.5px !important;
        font-weight:700 !important;
        padding:0 14px !important;
        border-radius:14px !important;
        cursor:pointer;
        display:inline-flex !important;
        align-items:center;
        justify-content:center;
        border:1px solid rgba(217,160,10,.35) !important;
        background:rgba(46,36,16,.85) !important;
        color:var(--ink) !important;
        white-space:nowrap !important;
        transition:all .15s ease;
        box-sizing:border-box !important;
      }
      .navbtn:hover{background:rgba(56,44,20,.9) !important}
      .navbtn:active{transform:scale(0.96)}
      .navbtn.next{
        background:linear-gradient(135deg,#ffe38a,#d9a00a) !important;
        border:1px solid rgba(255,255,255,.25) !important;
        color:#140e02 !important;
        font-weight:800 !important;
        box-shadow:0 4px 14px rgba(217,160,10,.4) !important;
      }
      .navbtn.next:hover{filter:brightness(1.1) !important}
      .navbtn:disabled{opacity:.35 !important;pointer-events:none}

      /* Player Centralizado Responsivo Ergonômico */
      .audio{
        flex:1 1 auto !important;
        min-width:0 !important;
        height:54px !important;
        margin:0 !important;
        background:linear-gradient(90deg,rgba(46,36,16,.96),rgba(33,24,10,.98)) !important;
        border:1px solid rgba(217,160,10,.5) !important;
        border-radius:14px !important;
        padding:4px 12px !important;
        cursor:pointer;
        display:flex !important;
        flex-direction:row !important;
        align-items:center !important;
        gap:10px !important;
        box-shadow:0 4px 16px rgba(0,0,0,.5);
        box-sizing:border-box !important;
        overflow:hidden !important;
      }
      .playbtn{
        flex:0 0 38px !important;
        width:38px !important;
        height:38px !important;
        border-radius:50% !important;
        background:linear-gradient(135deg,#ffe38a,#d9a00a) !important;
        border:1px solid rgba(255,255,255,.25) !important;
        cursor:pointer;
        display:flex !important;
        align-items:center;
        justify-content:center;
        box-shadow:0 3px 12px rgba(217,160,10,.5);
        transition:transform .15s ease;
        padding:0 !important;
      }
      .playbtn:hover{transform:scale(1.08)}
      .playbtn:active{transform:scale(0.92)}
      .playbtn svg{width:15px;height:15px;fill:#140e02 !important}

      .acontrol{
        flex:1 1 auto !important;
        min-width:0 !important;
        display:flex !important;
        flex-direction:column !important;
        justify-content:center !important;
        gap:2px !important;
        overflow:hidden !important;
        box-sizing:border-box !important;
      }
      .arow{
        display:flex !important;
        flex-direction:row !important;
        justify-content:space-between !important;
        align-items:center !important;
        width:100% !important;
        min-width:0 !important;
        margin:0 !important;
        line-height:1.1 !important;
        gap:4px !important;
      }
      .alabel{
        color:var(--red2) !important;
        font-size:10.5px !important;
        font-weight:700 !important;
        letter-spacing:1px !important;
        white-space:nowrap !important;
        overflow:hidden !important;
        text-overflow:ellipsis !important;
        text-transform:uppercase;
        flex:1 1 auto !important;
        min-width:0 !important;
      }
      .atime{
        color:var(--muted) !important;
        font-size:11px !important;
        font-variant-numeric:tabular-nums !important;
        font-weight:600 !important;
        white-space:nowrap !important;
        flex:0 0 auto !important;
        margin-left:auto !important;
      }
      .atrack{
        position:relative;
        width:100% !important;
        height:6px !important;
        border-radius:99px !important;
        background:rgba(255,255,255,.16) !important;
        overflow:hidden !important;
        cursor:pointer;
        margin:0 !important;
      }
      .afill{
        height:100% !important;
        width:0%;
        background:linear-gradient(90deg,var(--red),var(--gold)) !important;
        border-radius:99px !important;
        transition:width .1s linear;
      }

      @media (max-width:480px){
        header{padding:8px 10px 5px !important}
        .etapa{font-size:11px !important}
        .footer-wrap{gap:4px !important}
        .navbtn{min-width:60px !important;font-size:11px !important;padding:0 6px !important;height:38px !important}
        .audio{padding:2px 6px !important;height:38px !important}
        .playbtn{flex:0 0 28px !important;width:28px !important;height:28px !important}
        .playbtn svg{width:11px !important;height:11px !important}
        .alabel{font-size:8px !important;letter-spacing:0.5px !important}
        .atime{font-size:9.5px !important}
      }
      .banner{
        width:100%;aspect-ratio:5/2;object-fit:cover;display:block;
        border-radius:14px;border:1px solid var(--line);
        margin-bottom:16px;background:#251a0a;
      }
      /* ===== CAPA: imagem primeiro, título abaixo ===== */
      .coverimg{
        width:100%;aspect-ratio:7/4.4;object-fit:cover;object-position:center 38%;display:block;
        border-radius:16px;border:1px solid var(--line);
        box-shadow:0 20px 44px rgba(0,0,0,.5),0 0 34px rgba(217,160,10,.12);
        margin-bottom:16px;background:#251a0a;
      }
      .covertitle{
        font-family:"Playfair Display",Georgia,serif;font-size:36px;line-height:1.12;
        font-weight:800;margin:0 0 6px;
      }
      .coverrule{
        height:3px;width:72px;border-radius:99px;margin:12px 0 16px;
        background:linear-gradient(90deg,var(--red),var(--gold));
      }
      /* ===== IMAGEM VAZADA NO MEIO DO TEXTO ===== */
      .vazada{
        position:relative;height:138px;border-radius:14px;overflow:hidden;
        margin:16px 0;border:1px solid rgba(212,175,55,.2);background:#251a0a;
      }
      .vazada img{
        width:100%;height:100%;object-fit:cover;object-position:center 40%;
        opacity:.42;display:block;
      }
      .vazada::after{
        content:"";position:absolute;inset:0;pointer-events:none;
        background:linear-gradient(180deg,rgba(29,8,16,.72),rgba(29,8,16,0) 38%,rgba(29,8,16,0) 62%,rgba(29,8,16,.72));
      }
      .scroll.enter{animation:fadein .32s ease}
      @keyframes fadein{from{opacity:.25}to{opacity:1}}
      /* ===== TERMO TÉCNICO EM DESTAQUE ===== */
      .term{color:var(--red2);font-weight:700}
      p b.term, ul.tight li b.term, .box p b.term{color:var(--red2)}
      /* ===== FRASE-CHAVE ===== */
      .frasechave{
        background:linear-gradient(160deg,rgba(217,160,10,.17),rgba(217,160,10,.05));
        border:1px solid rgba(217,160,10,.45);border-radius:14px;
        padding:14px 16px;margin:16px 0;
      }
      .frasechave .flabel{color:var(--red2);font-size:11.5px;font-weight:700;letter-spacing:1.8px;margin:0 0 6px;display:flex;align-items:center}
      .frasechave p.fq2{font-family:"Playfair Display",Georgia,serif;font-size:19px;line-height:1.45;margin:0;color:#fdf3f4}
      /* ===== CARTÃO DE FECHAMENTO DE BLOCO ===== */
      .fimbloco{
        background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:14px 16px;margin:16px 0 4px;
      }
      .fimbloco .flabel{color:var(--gold2);font-size:11.5px;font-weight:700;letter-spacing:1.8px;margin:0 0 8px;display:flex;align-items:center}
      .fimbloco ul{list-style:none;margin:0;padding:0}
      .fimbloco li{position:relative;font-size:15.5px;line-height:1.5;padding:5px 0 5px 22px;border-bottom:1px dashed rgba(255,255,255,.07)}
      .fimbloco li:last-child{border-bottom:none}
      .fimbloco li::before{content:"◆";position:absolute;left:2px;top:10px;font-size:8px;color:var(--gold)}
      .fimbloco li b{color:var(--gold2);font-weight:700}
      /* ===== ÍCONES DOS BLOCOS ESPECIAIS ===== */
      .bic{display:inline-flex;vertical-align:-2px;margin-right:7px;flex:0 0 auto}
      .bic svg{width:14px;height:14px;display:block}
      /* ===== SELO DE PROGRESSO POR BLOCO ===== */
      .sealrow{margin-top:9px}
      .blockseal{
        display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.6px;
        color:var(--gold2);border:1px solid var(--line);border-radius:99px;
        padding:4px 11px;background:rgba(212,175,55,.07);text-transform:uppercase;
      }
      .kicker{color:var(--red2);font-size:12px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;margin:0 0 6px}
      .kicker::before{content:"◆";font-size:8px;vertical-align:2px;margin-right:7px;color:var(--gold)}
      h2{font-family:"Playfair Display",Georgia,serif;font-size:25px;line-height:1.22;margin:0 0 12px;font-weight:700}
      p{font-size:16.5px;line-height:1.62;margin:0 0 12px;color:var(--ink)}
      p.lead{font-size:17.5px;color:#fdf3f4}
      ul.tight{list-style:none;margin:4px 0 14px;padding:0}
      ul.tight li{
        position:relative;font-size:16.5px;line-height:1.55;
        padding:7px 0 7px 24px;border-bottom:1px dashed rgba(255,255,255,.07);
      }
      ul.tight li:last-child{border-bottom:none}
      ul.tight li::before{content:"◆";position:absolute;left:2px;top:12px;font-size:8px;color:var(--gold)}
      ul.tight li b, p b{color:var(--gold2);font-weight:700}
      .box{
        background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:14px 16px;margin:14px 0;
      }
      .box .blabel{color:var(--red2);font-size:11.5px;font-weight:700;letter-spacing:1.8px;margin:0 0 6px}
      .box p{margin:0;font-size:15.5px}
      .box p + p{margin-top:8px}
      .box.exemplo{position:relative;overflow:hidden}
      .box.exemplo .wm{
        position:absolute;top:0;right:0;width:74%;height:100%;object-fit:cover;
        opacity:.15;mix-blend-mode:screen;pointer-events:none;
        -webkit-mask-image:linear-gradient(to left,#000 40%,transparent 96%);
        mask-image:linear-gradient(to left,#000 40%,transparent 96%);
      }
      .box.exemplo .excontent{position:relative;z-index:1}
      .viarow{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:13px 14px;margin:10px 0}
      .vianum{
        flex:0 0 auto;width:40px;height:40px;border-radius:50%;
        border:1.5px solid var(--red);color:var(--red2);
        display:flex;align-items:center;justify-content:center;
        font-family:"Playfair Display",serif;font-weight:700;font-size:16px;
      }
      .viarow h3{margin:2px 0 3px;font-size:17px;font-weight:700}
      .viarow p{margin:0;font-size:15px;color:var(--muted);line-height:1.5}
      .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
      .chip{border:1px solid var(--line);color:var(--gold2);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;background:rgba(212,175,55,.07)}
      /* .audio original migrado */
      .qtext{font-size:17.5px;line-height:1.6;margin-bottom:14px}
      .opt{
        display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
        background:var(--panel2);border:1.5px solid rgba(255,255,255,.12);color:var(--ink);
        border-radius:13px;padding:13px 14px;margin:9px 0;font-size:16px;line-height:1.45;
        font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s;
      }
      .opt:hover{border-color:rgba(217,160,10,.65)}
      .opt .letter{
        flex:0 0 auto;width:27px;height:27px;border-radius:8px;margin-top:1px;
        border:1.5px solid var(--red);color:var(--red2);
        display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
      }
      .opt.correct{border-color:var(--ok);background:rgba(62,207,122,.12)}
      .opt.correct .letter{border-color:var(--ok);color:var(--ok)}
      .opt.wrong{border-color:var(--bad);background:rgba(255,122,122,.1)}
      .opt.wrong .letter{border-color:var(--bad);color:var(--bad)}
      .opt:disabled{cursor:default;opacity:.92}
      .feedback{display:none;border-radius:13px;padding:13px 15px;margin-top:13px;font-size:15.5px;line-height:1.55}
      .feedback.show{display:block}
      .feedback.good{background:rgba(62,207,122,.13);border:1px solid rgba(62,207,122,.5)}
      .feedback.bad{background:rgba(255,122,122,.1);border:1px solid rgba(255,122,122,.45)}
      .feedback b{display:block;margin-bottom:3px;font-size:16px}
      .flashwrap{perspective:1200px;margin:6px 0 4px}
      .flash{
        position:relative;width:100%;min-height:250px;cursor:pointer;
        transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1);
      }
      .flash.flipped{transform:rotateY(180deg)}
      .face{
        position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
        border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;
      }
      .face.front{background:linear-gradient(160deg,#33121b,#200a10);border:1.5px solid var(--line);text-align:center;align-items:center}
      .face.back{background:linear-gradient(160deg,#3d1620,#2a0e16);border:1.5px solid var(--red);transform:rotateY(180deg)}
      .face .flabel{color:var(--red2);font-size:11.5px;font-weight:700;letter-spacing:2px;margin-bottom:12px}
      .face.front .fq{font-family:"Playfair Display",serif;font-size:21px;line-height:1.4}
      .face.back p{font-size:16px;line-height:1.6;margin:0}
      .face.back p b{color:var(--gold2)}
      .tap{margin-top:16px;color:var(--muted);font-size:13px}
      .matchscore{color:var(--muted);font-size:14.5px;margin-bottom:10px}
      .matchscore b{color:var(--gold2)}
      .matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
      .mbtn{
        background:var(--panel2);border:1.5px solid rgba(255,255,255,.12);color:var(--ink);
        border-radius:12px;padding:11px 11px;font-size:14.5px;line-height:1.4;font-family:inherit;
        cursor:pointer;text-align:left;transition:border-color .15s,background .15s;
      }
      .mbtn.sel{border-color:var(--red);background:rgba(217,160,10,.16)}
      .mbtn.done{border-color:var(--ok);background:rgba(62,207,122,.12);color:#c9f2da;cursor:default}
      .mbtn.shake{animation:shake .35s}
      @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
      .matchdone{display:none;margin-top:14px;background:rgba(62,207,122,.13);border:1px solid rgba(62,207,122,.5);border-radius:13px;padding:13px 15px;font-size:15.5px}
      .matchdone.show{display:block}
      table.cmp{width:100%;border-collapse:collapse;margin:8px 0 6px;font-size:14px}
      table.cmp th{
        background:#33121b;color:var(--gold2);text-align:left;padding:10px 9px;
        font-size:13px;letter-spacing:.4px;border-bottom:2px solid var(--red);
      }
      table.cmp td{padding:10px 9px;border-bottom:1px solid rgba(255,255,255,.09);line-height:1.45;vertical-align:top}
      table.cmp td.t{font-weight:700;color:var(--gold2)}
      .explorebox{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:4px 0 12px;background:#251a0a}
      .explorebox img{width:100%;display:block}
      .hotspot{
        position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;
        background:rgba(20,14,2,.85);border:2px solid var(--gold);color:var(--gold2);
        font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;z-index:2;
        display:flex;align-items:center;justify-content:center;
      }
      .hotspot::after{
        content:"";position:absolute;inset:-2px;border-radius:50%;
        border:2px solid rgba(212,175,55,.8);animation:pulse 1.8s ease-out infinite;pointer-events:none;
      }
      @keyframes pulse{0%{transform:scale(1);opacity:.9}70%{transform:scale(1.7);opacity:0}100%{transform:scale(1.7);opacity:0}}
      .hotspot.active{background:linear-gradient(180deg,#ff7a8a,#c8102e);border-color:#fff;color:#fff}
      .hotspot.active::after{display:none}
      .hotspot.seen{background:var(--gold);color:#2a0e16;border-color:var(--gold2)}
      .hotspot.seen::after{animation:none;opacity:0}
      .explorecount{color:var(--muted);font-size:14.5px;margin:0 0 10px}
      .explorecount b{color:var(--gold2)}
      .hotpanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 6px}
      .hotpanel h3{margin:0 0 6px;font-size:18px;font-family:"Playfair Display",serif;font-weight:700}
      .hotpanel p{margin:0;font-size:15.5px}
      .explorehint{color:var(--muted);font-size:15px;margin:0}
      .revealcard{
        display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink);font-family:inherit;
        background:linear-gradient(160deg,#33121b,#200a10);border:1.5px solid var(--line);

    "titulo": "Puissance publique: o poder que exorbita",
    "corpo": "<p>Começo pelo primeiro polo da disputa original. O critério da <b class=\"term\">puissance publique</b>, expressão francesa para o poder público, define o Direito Administrativo pelo <b>poder</b> que a Administração exerce. Ele se caracteriza pela <b>exorbitância frente ao direito privado</b>: a Administração não age como um particular qualquer, ela age revestida de prerrogativas que excedem o direito comum.</p><div class=\"vazada\" aria-hidden=\"true\"><img src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-administrativo/01-origens-e-definicoes/aula-02-definicoes/imagens/puissance.webp\" alt=\"\"></div><p>Dentro desse critério, a doutrina separa dois tipos de atuação: os <b>atos de império</b>, em que o Estado se impõe unilateralmente, de cima para baixo, e os <b>atos de gestão</b>, em que ele administra os seus bens e serviços. O critério enxerga muito bem o ato de império, aquele em que a desigualdade entre Estado e particular aparece com toda a força.</p><p>Mas a falha aparece justamente aí: esse critério <b>deixa de fora os atos negociais praticados em igualdade</b>. Quando a Administração negocia em pé de igualdade com o particular, sem exorbitância, sem império, esse pedaço da atividade administrativa escapa da definição. A cerca ficou estreita: o poder entrou, a negociação ficou do lado de fora.</p><div class=\"box exemplo\"><img class=\"wm\" src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-administrativo/01-origens-e-definicoes/aula-02-definicoes/imagens/puissance.webp\" alt=\"\" aria-hidden=\"true\"><div class=\"excontent\"><p class=\"blabel\">EXEMPLO PRÁTICO</p><p>Pense em duas cenas. Na primeira, o Estado desapropria um imóvel por decisão unilateral: é ato de império, exorbitância pura, e o critério da puissance publique o enxerga perfeitamente. Na segunda, a Administração compra material de uma papelaria em condições de igualdade com qualquer comprador: é ato negocial, sem império, e esse critério simplesmente não o alcança.</p></div></div>",
    "narr": "Puissance publique: o poder que exorbita. Começo pelo primeiro polo da disputa original. O critério da puissance publique, expressão francesa para o poder público, define o Direito Administrativo pelo poder que a Administração exerce. Ele se caracteriza pela exorbitância frente ao direito privado: a Administração não age como um particular qualquer, ela age revestida de prerrogativas que excedem o direito comum. Dentro desse critério, a doutrina separa dois tipos de atuação: os atos de império, em que o Estado se impõe unilateralmente, de cima para baixo, e os atos de gestão, em que ele administra os seus bens e serviços. O critério enxerga muito bem o ato de império, aquele em que a desigualdade entre Estado e particular aparece com toda a força. Mas a falha aparece justamente aí: esse critério deixa de fora os atos negociais praticados em igualdade. Quando a Administração negocia em pé de igualdade com o particular, sem exorbitância, sem império, esse pedaço da atividade administrativa escapa da definição. A cerca ficou estreita: o poder entrou, a negociação ficou do lado de fora. Exemplo prático: Pense em duas cenas. Na primeira, o Estado desapropria um imóvel por decisão unilateral: é ato de império, exorbitância pura, e o critério da puissance publique o enxerga perfeitamente. Na segunda, a Administração compra material de uma papelaria em condições de igualdade com qualquer comprador: é ato negocial, sem império, e esse critério simplesmente não o alcança."

    "tipo": "Conteúdo",

    "alt": "Ônibus urbano atual, posto de saúde claro e escola pública ligados por fios de luz dourada numa manhã ensolarada",
    "kicker": "Critérios clássicos · Service public",
    "titulo": "Service public: o resumo dos serviços públicos",
    "corpo": "<p>Do outro lado da disputa original está o critério do <b class=\"term\">service public</b>, o serviço público. Se a puissance publique olhava para o poder, este olha para a <b>prestação</b>: o Direito Administrativo seria, nessa leitura, um resumo das regras de <b>gestão e de organização dos serviços públicos</b>. Tudo o que organiza e movimenta o serviço prestado à população entraria na definição.</p><div class=\"vazada\" aria-hidden=\"true\"><img src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-administrativo/01-origens-e-definicoes/aula-02-definicoes/imagens/service.webp\" alt=\"\"></div><p>É uma lente poderosa, porque o serviço público é mesmo uma das faces mais visíveis da Administração: transporte, saúde, educação, coleta, atendimento. Mas ela também tem o seu ponto cego, e ele é duplo: esse critério <b>não abrange os delegatários</b> e <b>não abrange o exercício de atividade econômica</b> pelo Estado.</p><div class=\"box exemplo\"><img class=\"wm\" src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-administrativo/01-origens-e-definicoes/aula-02-definicoes/imagens/service.webp\" alt=\"\" aria-hidden=\"true\"><div class=\"excontent\"><p class=\"blabel\">EXEMPLO PRÁTICO</p><p>Quando o Estado delega o transporte coletivo a uma empresa concessionária, quem presta o serviço é um delegatário, e esse pedaço escapa do critério. E quando o Estado explora atividade econômica por meio de uma empresa estatal, essa atuação também fica de fora. Ou seja: nem todo serviço ligado ao Estado cabe na definição que o próprio serviço inspirou.</p></div></div><div class=\"frasechave\"><p class=\"flabel\">FRASE-CHAVE</p><p class=\"fq2\">Puissance publique enxerga o poder e perde a negociação em igualdade; service public enxerga o serviço e perde os delegatários e a atividade econômica.</p></div>",
    "narr": "Service public: o resumo dos serviços públicos. Do outro lado da disputa original está o critério do service public, o serviço público. Se a puissance publique olhava para o poder, este olha para a prestação: o Direito Administrativo seria, nessa leitura, um resumo das regras de gestão e de organização dos serviços públicos. Tudo o que organiza e movimenta o serviço prestado à população entraria na definição. É uma lente poderosa, porque o serviço público é mesmo uma das faces mais visíveis da Administração: transporte, saúde, educação, coleta, atendimento. Mas ela também tem o seu ponto cego, e ele é duplo: esse critério não abrange os delegatários e não abrange o exercício de atividade econômica pelo Estado. Exemplo prático: Quando o Estado delega o transporte coletivo a uma empresa concessionária, quem presta o serviço é um delegatário, e esse pedaço escapa do critério. E quando o Estado explora atividade econômica por meio de uma empresa estatal, essa atuação também fica de fora. Ou seja: nem todo serviço ligado ao Estado cabe na definição que o próprio serviço inspirou. Puissance publique enxerga o poder e perde a negociação em igualdade; service public enxerga o serviço e perde os delegatários e a atividade econômica."

    "tipo": "Conteúdo",

    "titulo": "Poder Executivo: as leis que disciplinam um só Poder",
    "corpo": "<p>O terceiro critério muda o foco do poder e do serviço para o <b>órgão</b>. Pelo critério do <b class=\"term\">Poder Executivo</b>, o Direito Administrativo seria o <b>complexo de leis que disciplinam o Poder Executivo</b>. A lógica parece arrumada: se quem administra é o Executivo, o ramo seria o conjunto de normas desse Poder.</p><div class=\"vazada\" aria-hidden=\"true\"><img src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-administrativo/01-origens-e-definicoes/aula-02-definicoes/imagens/executivo.webp\" alt=\"\"></div><p>O problema é que a premissa está errada, e por dois motivos. Primeiro: esse critério <b>exclui os outros Poderes, que também exercem função administrativa</b>. O Legislativo e o Judiciário legislam e julgam como função típica, mas também administram: organizam os seus servidores, os seus prédios, os seus concursos e as suas compras. Essa administração dos outros Poderes ficaria sem definição.</p><p>Segundo: há <b>matérias submetidas ao direito privado</b>, como as de natureza <b>comercial e consumerista</b>, que atravessam a atuação estatal e não se deixam prender na moldura de um único Poder. Somando as duas falhas, a cerca desse critério também não fecha o terreno.</p><div class=\"fimbloco\"><p class=\"flabel\">NESSE BLOCO VOCÊ VIU</p><ul><li>Puissance publique: exorbitância frente ao direito privado, com atos de império e atos de gestão; deixa de fora os atos negociais praticados em igualdade.</li><li>Service public: resumo das regras de gestão e organização dos serviços públicos; não abrange os delegatários e o exercício de atividade econômica.</li><li>Poder Executivo: complexo de leis que disciplinam esse Poder; exclui os outros Poderes, que também exercem função administrativa, e ignora matérias de direito privado, como as comerciais e consumeristas.</li></ul></div>",
    "narr": "Poder Executivo: as leis que disciplinam um só Poder. O terceiro critério muda o foco do poder e do serviço para o órgão. Pelo critério do Poder Executivo, o Direito Administrativo seria o complexo de leis que disciplinam o Poder Executivo. A lógica parece arrumada: se quem administra é o Executivo, o ramo seria o conjunto de normas desse Poder. O problema é que a premissa está errada, e por dois motivos. Primeiro: esse critério exclui os outros Poderes, que também exercem função administrativa. O Legislativo e o Judiciário legislam e julgam como função típica, mas também administram: organizam os seus servidores, os seus prédios, os seus concursos e as suas compras. Essa administração dos outros Poderes ficaria sem definição. Segundo: há matérias submetidas ao direito privado, como as de natureza comercial e consumerista, que atravessam a atuação estatal e não se deixam prender na moldura de um único Poder. Somando as duas falhas, a cerca desse critério também não fecha o terreno."

    function bindAudio(){
      var playBtn = document.getElementById("playBtn");
      var box = document.getElementById("audioBox");
      var track = document.getElementById("aTrack");

      function onPlayToggle(ev){
        if(ev){ ev.stopPropagation(); ev.preventDefault(); }
        unlocked = true;
        togglePlay();
      }

      playBtn.addEventListener("click", onPlayToggle);
      playBtn.addEventListener("touchend", onPlayToggle);

      function onSeek(ev){
        if(ev){ ev.stopPropagation(); }
        var r = track.getBoundingClientRect();
        var clientX = ev.clientX;
        if(clientX === undefined && ev.touches && ev.touches[0]){
          clientX = ev.touches[0].clientX;
        }
        if(player.duration && r.width > 0 && clientX !== undefined){
          var pct = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
          player.currentTime = player.duration * pct;
        }
      }

      track.addEventListener("click", onSeek);
      track.addEventListener("touchstart", onSeek);
    }

    function tryPlay(){
      var p = player.play();
      if(p && p.catch){ p.catch(function(){}); }
    }
    function togglePlay(){
      if(player.paused){ tryPlay(); } else { player.pause(); }
    }

    player.addEventListener("play", function(){
      var b = document.getElementById("playBtn");
      if(b) b.innerHTML = ICON_PAUSE;
    });
    player.addEventListener("pause", function(){
      var b = document.getElementById("playBtn");
      if(b) b.innerHTML = ICON_PLAY;
    });
    player.addEventListener("timeupdate", function(){
      var f = document.getElementById("aFill");
      var t = document.getElementById("aTime");
      if(f && player.duration) f.style.width = (100 * player.currentTime / player.duration) + "%";
      if(t && player.duration) t.textContent = fmt(player.currentTime) + " / " + fmt(player.duration);
      karaSync();
    });
    player.addEventListener("loadedmetadata", function(){
      var t = document.getElementById("aTime");
      if(t && player.duration) t.textContent = "0:00 / " + fmt(player.duration);
    });
    player.addEventListener("ended", function(){
      var f = document.getElementById("aFill");
      if(f) f.style.width = "0%";
    });

    function bindInteractions(s){
      if(s.tipo === "Questão" || s.tipo === "Questão de banca"){
        var answered = state[idx] && state[idx].answered;
        var opts = scrollArea.querySelectorAll(".opt");
        var fb = document.getElementById("feedback");
        function paint(chosen){
          opts.forEach(function(o){
            var oi = parseInt(o.getAttribute("data-opt"), 10);
            o.disabled = true;
            if(oi === s.certa) o.classList.add("correct");
            else if(oi === chosen) o.classList.add("wrong");
          });
          fb.className = "feedback show " + (chosen === s.certa ? "good" : "bad");
          fb.innerHTML = "<b>" + (chosen === s.certa ? "Resposta certa!" : "Não foi dessa vez.") + "</b>" + s.feedback;
        }
        if(answered){ paint(state[idx].chosen); }
        opts.forEach(function(o){
          o.addEventListener("click", function(){
            if(state[idx] && state[idx].answered) return;
            var oi = parseInt(o.getAttribute("data-opt"), 10);
            state[idx] = {answered:true, chosen:oi};
            paint(oi);
          });
        });
      } else if(s.tipo === "Flashcard"){
        var card = document.getElementById("flashCard");
        card.addEventListener("click", function(){ card.classList.toggle("flipped"); });
      } else if(s.tipo === "Ligar termos"){
        var st = state[idx];
        var terms = scrollArea.querySelectorAll(".term");
        var defs = scrollArea.querySelectorAll(".def");
        function select(el, group){
          if(el.classList.contains("done")) return;
          var groupBtns = group === "t" ? terms : defs;
          groupBtns.forEach(function(b){ b.classList.remove("sel"); });
          el.classList.add("sel");
          if(group === "t") st.selT = parseInt(el.getAttribute("data-term"), 10);
          else st.selD = parseInt(el.getAttribute("data-def"), 10);
          checkMatch();
        }
        function checkMatch(){
          if(st.selT === null || st.selT === undefined || st.selD === null || st.selD === undefined) return;
          var tBtn = scrollArea.querySelector('.term[data-term="' + st.selT + '"]');
          var dBtn = scrollArea.querySelector('.def[data-def="' + st.selD + '"]');
          if(st.selT === st.selD){
            st.done[st.selT] = true;
            st.count++;
            tBtn.classList.add("done"); dBtn.classList.add("done");
            tBtn.classList.remove("sel"); dBtn.classList.remove("sel");
            var mc = document.getElementById("matchCount");
            if(mc) mc.textContent = st.count + " de " + s.pares.length;
            if(st.count === s.pares.length){
              var md = document.getElementById("matchDone");
              if(md) md.classList.add("show");
            }
          } else {
            [tBtn, dBtn].forEach(function(b){
              b.classList.add("shake");
              setTimeout(function(){ b.classList.remove("shake", "sel"); }, 380);
            });
          }
          st.selT = null; st.selD = null;
        }
        terms.forEach(function(b){ b.addEventListener("click", function(){ select(b, "t"); }); });
        defs.forEach(function(b){ b.addEventListener("click", function(){ select(b, "d"); }); });
      } else if(s.tipo === "Explorar"){
        var es = state[idx];
        var hots = scrollArea.querySelectorAll(".hotspot");
        hots.forEach(function(b){
          b.addEventListener("click", function(){
            var pi = parseInt(b.getAttribute("data-hot"), 10);
            if(!es.seen[pi]){ es.seen[pi] = true; es.count++; }
            es.cur = pi;
            var ec = document.getElementById("exploreCount");
            if(ec) ec.textContent = es.count + " de " + s.pontos.length;
            var panel = document.getElementById("hotPanel");
            if(panel) panel.innerHTML = hotPanelHTML(s, es);
            hots.forEach(function(o){
              var oi = parseInt(o.getAttribute("data-hot"), 10);
              var isCur = oi === pi;
              var isSeen = !!es.seen[oi] && !isCur;
              o.classList.toggle("active", isCur);
              o.classList.toggle("seen", isSeen);
              o.textContent = isSeen ? "✓" : (oi + 1);
            });
            if(panel) panel.scrollIntoView({behavior:"smooth", block:"nearest"});
          });
        });
      } else if(s.tipo === "Toque e revele"){
        var rs = state[idx];
        var cards = scrollArea.querySelectorAll(".revealcard");
        cards.forEach(function(card){
          card.addEventListener("click", function(){
            var ci = parseInt(card.getAttribute("data-card"), 10);
            var stage = rs.stage[ci] || 0;
            if(stage >= 2) return;
            stage++;
            rs.stage[ci] = stage;
            var c = s.cartas[ci];
            if(stage === 2){
              rs.count++;
              var rc = document.getElementById("revealCount");
              if(rc) rc.textContent = rs.count + " de " + s.cartas.length;
              card.classList.remove("open");
              card.classList.add("done");
              card.innerHTML = '<p class="rlabel">RESPOSTA</p><p class="rbody">' + c.r + '</p>';
            } else {
              card.classList.add("open");
              card.innerHTML = '<p class="rlabel">PERGUNTA</p><p class="rbody">' + c.p + '</p><p class="rhint">Pensou? Toque de novo para revelar a resposta</p>';
            }
          });
        });
      } else if(s.tipo === "Linha do tempo"){
        var ts = state[idx];
        scrollArea.querySelectorAll(".tlbtn").forEach(function(b){
          b.addEventListener("click", function(){
            var mi = parseInt(b.getAttribute("data-tl"), 10);
            var body = document.getElementById("tlBody" + mi);
            var opening = !body.classList.contains("show");
            body.classList.toggle("show", opening);
            b.classList.toggle("open", opening);
            ts.open[mi] = opening;
            if(opening && !b.getAttribute("data-counted")){
              b.setAttribute("data-counted", "1");
              ts.count++;
              var tc = document.getElementById("tlCount");
              if(tc) tc.textContent = ts.count + " de " + s.marcos.length;

      } else if(s.tipo === "Verdadeiro ou falso"){
        var vst = state[idx];
        var vfArea = document.getElementById("vfArea");
        function renderVF(){
          if(vst.done){
            vfArea.innerHTML = '<div class="finalscore"><p>Você acertou</p><p class="big">' + vst.score + ' de ' + s.afirmacoes.length + '</p><p>' + (vst.score === s.afirmacoes.length ? "Perfeito! Nenhuma pegadinha te derrubou." : vst.score >= 3 ? "Muito bem! O seu raciocínio está ficando afiado." : "Bom treino! Volte às cartas com calma depois de rever as explicações das etapas.") + '</p></div>';
            return;

          var a = s.afirmacoes[vst.cur];

          h += '<div class="vfstage"><div class="vfcard" id="vfCard"><span class="vfstamp f" id="stampF">FALSO</span><span class="vfstamp v" id="stampV">VERDADEIRO</span><p class="vflabel">AFIRMAÇÃO</p><p class="vftext">' + a.t + '</p></div></div>';
          if(!vst.answered){
            h += '<div class="vfbtns"><button class="vfbtn f" type="button" id="vfFalse">← Falso</button><button class="vfbtn v" type="button" id="vfTrue">Verdadeiro →</button></div>';

          } else {
            h += '<div class="feedback show ' + (vst.chosen === a.v ? 'good' : 'bad') + '"><b>' + (vst.chosen === a.v ? "Acertou! " : "Não foi dessa vez. ") + (a.v ? "É verdadeira." : "É falsa.") + '</b>' + a.exp + '</div>';
            h += '<button class="againbtn" type="button" id="vfNext" style="width:100%">' + (vst.cur === s.afirmacoes.length - 1 ? "Ver o resultado" : "Próxima carta →") + '</button>';

        function answerVF(choice){
          if(vst.answered) return;

        function bindVFCard(){
          var card = document.getElementById("vfCard");

          if(bT) bT.addEventListener("click", function(){ answerVF(true); });
          if(bN) bN.addEventListener("click", function(){
            if(vst.cur === s.afirmacoes.length - 1){ vst.done = true; }
            else { vst.cur++; vst.answered = false; vst.chosen = null; }
            renderVF();
          });
          if(!card || vst.answered) return;
          card.addEventListener("touchstart", function(ev){ ev.stopPropagation(); }, {passive:true});
          card.addEventListener("touchend", function(ev){ ev.stopPropagation(); }, {passive:true});
          var startX = null, dx = 0;
          var stampF = document.getElementById("stampF");
          var stampV = document.getElementById("stampV");
          card.addEventListener("pointerdown", function(ev){
            startX = ev.clientX; dx = 0;
            try{ card.setPointerCapture(ev.pointerId); }catch(e){}
          });
          card.addEventListener("pointermove", function(ev){
            if(startX === null) return;
            dx = ev.clientX - startX;
            card.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 22) + "deg)";
            if(stampV) stampV.style.opacity = dx > 12 ? Math.min(1, dx / 80) : 0;
            if(stampF) stampF.style.opacity = dx < -12 ? Math.min(1, -dx / 80) : 0;
          });
          card.addEventListener("pointerup", function(){
            if(startX === null) return;
            var finalDx = dx;
            startX = null;
            card.style.transform = "";
            if(stampV) stampV.style.opacity = 0;
            if(stampF) stampF.style.opacity = 0;
            if(finalDx > 70) answerVF(true);
            else if(finalDx < -70) answerVF(false);
          });
          card.addEventListener("pointercancel", function(){
            startX = null;
            card.style.transform = "";
          });
        }
        renderVF();
      } else if(s.tipo === "Comparador"){

        function setCmp(v){
          v = Math.max(0, Math.min(100, v));
          top.style.clipPath = "inset(0 0 0 " + v + "%)";
          handle.style.left = v + "%";
          range.value = v;
        }
        range.addEventListener("input", function(){ setCmp(parseFloat(range.value)); });
        range.addEventListener("touchstart", function(ev){ ev.stopPropagation(); }, {passive:true});
        range.addEventListener("touchend", function(ev){ ev.stopPropagation(); }, {passive:true});
        box.addEventListener("touchstart", function(ev){ ev.stopPropagation(); }, {passive:true});
        box.addEventListener("touchend", function(ev){ ev.stopPropagation(); }, {passive:true});
        var cmpDrag = false;
        function cmpFromEvent(ev){
          var r = box.getBoundingClientRect();
          setCmp((ev.clientX - r.left) / r.width * 100);
        }
        box.addEventListener("pointerdown", function(ev){ cmpDrag = true; try{ box.setPointerCapture(ev.pointerId); }catch(e){} cmpFromEvent(ev); });
        box.addEventListener("pointermove", function(ev){ if(cmpDrag) cmpFromEvent(ev); });
        box.addEventListener("pointerup", function(){ cmpDrag = false; });
        box.addEventListener("pointercancel", function(){ cmpDrag = false; });
        setCmp(50);

        var kbox = document.getElementById("karaokeBox");
        if(kbox){
          kbox.querySelectorAll(".sent").forEach(function(sp){
            sp.addEventListener("click", function(){
              karaSeek(parseInt(sp.getAttribute("data-sent"), 10));
            });
          });
        }
      } else if(s.tipo === "Mapa mental"){
        var ms = state[idx];
        scrollArea.querySelectorAll(".mindbtn").forEach(function(b){
          b.addEventListener("click", function(){
            var ri = parseInt(b.getAttribute("data-mind"), 10);
            var body = document.getElementById("mindBody" + ri);
            var opening = !body.classList.contains("show");
            body.classList.toggle("show", opening);
            b.classList.toggle("open", opening);
            ms.open[ri] = opening;
            b.querySelector(".marr").textContent = opening ? "▾ aberto" : "▸ tocar";
            if(opening && !ms.seen[ri]){
              ms.seen[ri] = true; ms.count++;
              var mc = document.getElementById("mindCount");
              if(mc) mc.textContent = ms.count + " de " + s.ramos.length;
            }
          });
        });
      } else if(s.tipo === "Desafio"){
        var dst = state[idx];
        var dArea = document.getElementById("desafioArea");
        var dLetters = ["A","B","C","D","E"];
        function renderDesafio(){
          if(dst.finished){
            var msg = dst.pts >= 500 ? "Pontuação máxima! Você dominou esta aula de ponta a ponta." : dst.pts >= 300 ? "Muito bem! O raciocínio da bigamia já está na sua mão." : "Bom começo! Refaça as questões e os flashcards da aula e tente de novo: o placar sobe rápido.";
            dArea.innerHTML = '<div class="finalscore"><p>SEU PLACAR FINAL</p><p class="big">' + dst.pts + ' pontos</p><p>' + msg + '</p><button class="againbtn" type="button" id="desafioAgain">Jogar de novo</button></div>';
            document.getElementById("desafioAgain").addEventListener("click", function(){
              dst.q = 0; dst.pts = 0; dst.answered = false; dst.chosen = null; dst.finished = false;
              renderDesafio();
            });
            return;
          }
          var pq = s.perguntas[dst.q];
          var h = '<div class="scorebar"><span>Pergunta <b>' + (dst.q + 1) + ' de ' + s.perguntas.length + '</b></span><span class="pts">' + dst.pts + ' pts</span></div>';
          h += '<p class="qtext">' + pq.q + '</p>';
          pq.ops.forEach(function(op, oi){
            var cls = "opt";
            if(dst.answered){
              if(oi === pq.certa) cls += " correct";
              else if(oi === dst.chosen) cls += " wrong";
            }
            h += '<button class="' + cls + '" type="button" data-dopt="' + oi + '"' + (dst.answered ? ' disabled' : '') + '><span class="letter">' + dLetters[oi] + '</span><span>' + op + '</span></button>';
          });
          if(dst.answered){
            h += '<div class="feedback show ' + (dst.chosen === pq.certa ? 'good' : 'bad') + '"><b>' + (dst.chosen === pq.certa ? "Resposta certa! +100 pontos" : "Não foi dessa vez.") + '</b>' + pq.exp + '</div>';
            h += '<button class="againbtn" type="button" id="desafioNext" style="width:100%">' + (dst.q === s.perguntas.length - 1 ? "Ver meu placar" : "Próxima pergunta →") + '</button>';
          }
          dArea.innerHTML = h;
          dArea.querySelectorAll(".opt").forEach(function(o){
            o.addEventListener("click", function(){
              if(dst.answered) return;
              var oi = parseInt(o.getAttribute("data-dopt"), 10);
              dst.answered = true;
              dst.chosen = oi;
              if(oi === pq.certa) dst.pts += 100;
              renderDesafio();
            });
          });
          var nb2 = document.getElementById("desafioNext");
          if(nb2) nb2.addEventListener("click", function(){
            if(dst.q === s.perguntas.length - 1){ dst.finished = true; }
            else { dst.q++; dst.answered = false; dst.chosen = null; }
            renderDesafio();
          });
        }
        renderDesafio();
      }
    }

    var karaIdx = -1;
    function karaFracs(s){
      var totalChars = 0;
      s.frases.forEach(function(f){ totalChars += f.length; });
      var acc = 0, fr = [];
      s.frases.forEach(function(f){
        fr.push([acc / totalChars, (acc + f.length) / totalChars]);
        acc += f.length;
      });
      return fr;
    }
    function karaSync(){
      var s = SLIDES[idx];
      if(!s || s.tipo !== "Karaokê" || !player.duration) return;
      var box = document.getElementById("karaokeBox");
      if(!box) return;
      var fr = karaFracs(s);
      var pos = player.currentTime / player.duration;
      var cur = 0;
      for(var i = 0; i < fr.length; i++){ if(pos >= fr[i][0]) cur = i; }
      if(cur === karaIdx) return;
      karaIdx = cur;
      var spans = box.querySelectorAll(".sent");
      spans.forEach(function(sp, si){
        sp.classList.toggle("on", si === cur);
        sp.classList.toggle("done", si < cur);
      });
      var el = spans[cur];
      if(el) el.scrollIntoView({behavior:"smooth", block:"nearest"});
    }
    function karaSeek(fi){
      var s = SLIDES[idx];
      if(!s || s.tipo !== "Karaokê" || !player.duration) return;
      var fr = karaFracs(s);
      player.currentTime = Math.max(0, fr[fi][0] * player.duration - 0.05);
      karaIdx = -1;
      karaSync();
      unlocked = true;
      tryPlay();
    }

    var BLOCKS = [[6, "Bloco 1 de 5 · Por que definir é difícil"], [12, "Bloco 2 de 5 · Os critérios clássicos"], [21, "Bloco 3 de 5 · Mais critérios em disputa"], [28, "Bloco 4 de 5 · O critério adotado no Brasil"], [36, "Bloco 5 de 5 · Revisão e desafio"], [37, "Fechamento"]];
    function blockLabel(i){
      for(var b = 0; b < BLOCKS.length; b++){ if(i <= BLOCKS[b][0]) return BLOCKS[b][1]; }
      return "Fechamento";
    }

    function show(i, autoplay){
      idx = Math.max(0, Math.min(total - 1, i));
      var s = SLIDES[idx];
      karaIdx = -1;
      scrollArea.innerHTML = slideHTML(s);
      scrollArea.scrollTop = 0; try { window.scrollTo({ top: 0, behavior: "instant" }); document.documentElement.scrollTop = 0; document.body.scrollTop = 0; } catch(e){}
      scrollArea.classList.remove("enter");
      void scrollArea.offsetWidth;
      scrollArea.classList.add("enter");
      var h1El = document.querySelector("header h1");
      if(h1El) h1El.style.display = idx === 0 ? "none" : "";
      var seal = document.getElementById("blockSeal");
      if(seal) seal.textContent = blockLabel(idx);
      etapaLabel.innerHTML = "Etapa <b>" + (idx + 1) + " de " + total + "</b> · " + s.tipo + (s.titulo ? ": " + s.titulo : "");
      progressFill.style.width = ((idx + 1) / total * 100) + "%";
      btnPrev.disabled = idx === 0;
      btnNext.innerHTML = idx === total - 1 ? "↺ Voltar ao início" : "Próximo →";
      bindInteractions(s);
      player.pause();
      player.src = audioSrc(idx);
      player.load();
      if(autoplay && unlocked){ tryPlay(); }
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: "AULA_INTERATIVA_PROGRESSO",
            etapaAtual: idx + 1,
            totalEtapas: total,
            aulaId: "admin-01-02"
          }, "*");
        }
      } catch (err) {}
    }

    btnPrev.addEventListener("click", function(){ show(idx - 1, true); });
    btnNext.addEventListener("click", function(){
      if(idx === total - 1){ show(0, true); } else { show(idx + 1, true); }
    });
    document.addEventListener("keydown", function(ev){
      if(ev.key === "ArrowRight"){ btnNext.click(); }
      else if(ev.key === "ArrowLeft"){ btnPrev.click(); }
    });
    document.addEventListener("pointerdown", function(){
      if(!unlocked){
        unlocked = true;
        if(player.paused){ tryPlay(); }
      }
    }, {once:false});

    var tx = null, ty = null;
    var phone = document.getElementById("phone");
    phone.addEventListener("touchstart", function(ev){
      tx = ev.touches[0].clientX; ty = ev.touches[0].clientY;
    }, {passive:true});
    phone.addEventListener("touchend", function(ev){
      if(tx === null) return;
      var dx = ev.changedTouches[0].clientX - tx;
      var dy = ev.changedTouches[0].clientY - ty;
      if(Math.abs(dx) > 64 && Math.abs(dx) > Math.abs(dy) * 1.7){
        if(dx < 0){ btnNext.click(); } else { btnPrev.click(); }
      }
      tx = null; ty = null;
    }, {passive:true});

    bindAudio();
    show(0, false);
    
  </script>
</html>
