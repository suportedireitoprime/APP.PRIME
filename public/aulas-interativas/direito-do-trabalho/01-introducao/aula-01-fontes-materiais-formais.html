<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" href="data:," />
    <title>Fontes materiais e formais · Direito do Trabalho</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <style>
      :root{
        --bg:#0c0616;
        --phone:#180b28;
        --panel:#2a1545;
        --panel2:#22103a;
        --red:#9d4edd;
        --red2:#d3a6ff;
        --gold:#d4af37;
        --gold2:#e9cd6d;
        --ink:#f4efff;
        --muted:#bda9d9;
        --line:rgba(212,175,55,.3);
        --ok:#3ecf7a;
        --bad:#ff7a7a;
        color-scheme:dark;
      }
      *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
      html,body{height:100%}
      body{
        margin:0;
        font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
        background:
          radial-gradient(900px 500px at 15% -10%, #2a1450 0%, transparent 60%),
          radial-gradient(800px 500px at 110% 110%, #20083a 0%, transparent 55%),
          var(--bg);
        color:var(--ink);
        display:flex;flex-direction:column;align-items:center;justify-content:center;
        gap:12px;padding:12px;
        min-height:100dvh;
      }
      .stage{
        display:flex;flex-direction:row;align-items:stretch;justify-content:center;
        gap:12px;width:min(574px,100%);flex:1 1 auto;min-height:0;
      }
      .phone{
        position:relative;
        width:auto;max-width:430px;min-width:0;
        flex:1 1 auto;min-height:0;
        background:linear-gradient(180deg,#1d0b33 0%,var(--phone) 30%);
        display:flex;flex-direction:column;
        overflow:hidden;
        border-radius:26px;
      }
      @media (min-width:520px){
        .phone{
          max-height:880px;
          border-radius:38px;
          border:1px solid rgba(168,110,230,.5);
          box-shadow:0 30px 80px rgba(0,0,0,.65),0 0 0 8px #0d0518,0 0 60px rgba(168,110,230,.1);
        }
      }
      header{
        padding:16px 20px 10px;
        border-bottom:1px solid rgba(168,110,230,.18);
        background:rgba(16,6,28,.55);
        flex:0 0 auto;
      }
      .hrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
      .subject{color:var(--red2);font-weight:700;font-size:11.5px;letter-spacing:2.4px}
      .design{color:var(--muted);font-size:11px;letter-spacing:1.4px;font-weight:600;white-space:nowrap}
      h1{font-family:"Playfair Display",Georgia,serif;font-size:21px;line-height:1.15;margin:6px 0 2px;font-weight:800}
      .etapa{color:var(--muted);font-size:13.5px;margin:0 0 10px}
      .etapa b{color:var(--ink);font-weight:600}
      .track{height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden}
      .fill{height:100%;background:linear-gradient(90deg,#5e2590,var(--red),var(--gold));border-radius:99px;transition:width .45s ease}
      .playerdock{
        flex:0 0 132px;width:132px;
        display:flex;flex-direction:column;justify-content:center;
        background:linear-gradient(180deg,#2b1547,#1a0a2e);
        border:1px solid rgba(168,110,230,.5);
        border-radius:18px;
        padding:18px 14px;
        box-shadow:0 14px 34px rgba(0,0,0,.5);
      }
      .playerdock .audio{margin:0;border:none;background:transparent;padding:0;width:100%;display:flex;flex-direction:column;gap:14px}
      .playerdock .audio .arow{flex-direction:column;align-items:flex-start;gap:6px;margin-bottom:0}
      .playerdock .audio .alabel{line-height:1.55}
      .playerdock .audio .acontrol{flex-direction:column;align-items:center;gap:14px}
      .playerdock .playbtn{width:56px;height:56px}
      .playerdock .playbtn svg{width:24px;height:24px}
      .playerdock .audio .atrack{flex:0 0 auto;width:100%}
      @media (max-width:560px){
        .stage{gap:10px}
        .playerdock{flex-basis:102px;width:102px;padding:14px 10px;border-radius:16px}
        .playerdock .audio .alabel{font-size:10px;letter-spacing:1.2px}
        .playerdock .audio .atime{font-size:11.5px}
        .playerdock .playbtn{width:50px;height:50px}
        header{padding:14px 15px 10px}
        .covertitle{font-size:28px}
        .scroll{padding:16px 15px 22px}
        footer{padding:12px 14px calc(12px + env(safe-area-inset-bottom))}
        .navbtn{font-size:15px;padding:14px 6px}
      }
      .scroll{
        flex:1 1 auto;overflow-y:auto;overflow-x:hidden;
        padding:18px 20px 26px;
        scrollbar-width:thin;scrollbar-color:rgba(168,110,230,.6) rgba(255,255,255,.04);
        overscroll-behavior:contain;
      }
      .scroll::-webkit-scrollbar{width:5px}
      .scroll::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:99px}
      .scroll::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--red),#4a148c);border-radius:99px}
      .banner{
        width:100%;aspect-ratio:5/2;object-fit:cover;display:block;
        border-radius:14px;border:1px solid var(--line);
        margin-bottom:16px;background:#22103a;
      }
      .coverimg{
        width:100%;aspect-ratio:7/4.4;object-fit:cover;object-position:center 38%;display:block;
        border-radius:16px;border:1px solid var(--line);
        box-shadow:0 20px 44px rgba(0,0,0,.5),0 0 34px rgba(168,110,230,.12);
        margin-bottom:16px;background:#22103a;
      }
      .covertitle{
        font-family:"Playfair Display",Georgia,serif;font-size:34px;line-height:1.12;
        font-weight:800;margin:0 0 6px;
      }
      .coverrule{
        height:3px;width:72px;border-radius:99px;margin:12px 0 16px;
        background:linear-gradient(90deg,var(--red),var(--gold));
      }
      .vazada{
        position:relative;height:138px;border-radius:14px;overflow:hidden;
        margin:16px 0;border:1px solid rgba(212,175,55,.2);background:#22103a;
      }
      .vazada img{
        width:100%;height:100%;object-fit:cover;object-position:center 40%;
        opacity:.42;display:block;
      }
      .vazada::after{
        content:"";position:absolute;inset:0;pointer-events:none;
        background:linear-gradient(180deg,rgba(24,11,40,.72),rgba(24,11,40,0) 38%,rgba(24,11,40,0) 62%,rgba(24,11,40,.72));
      }
      .scroll.enter{animation:fadein .32s ease}
      @keyframes fadein{from{opacity:.25}to{opacity:1}}
      .term{color:var(--red2);font-weight:700}
      p b.term, ul.tight li b.term, .box p b.term{color:var(--red2)}
      .frasechave{
        background:linear-gradient(160deg,rgba(168,110,230,.17),rgba(168,110,230,.05));
        border:1px solid rgba(168,110,230,.45);border-radius:14px;
        padding:14px 16px;margin:16px 0;
      }
      .frasechave .flabel{color:var(--red2);font-size:11.5px;font-weight:700;letter-spacing:1.8px;margin:0 0 6px;display:flex;align-items:center}
      .frasechave p.fq2{font-family:"Playfair Display",Georgia,serif;font-size:19px;line-height:1.45;margin:0;color:#faf5ff}
      .fimbloco{
        background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:14px 16px;margin:16px 0 4px;
      }
      .fimbloco .flabel{color:var(--gold2);font-size:11.5px;font-weight:700;letter-spacing:1.8px;margin:0 0 8px;display:flex;align-items:center}
      .fimbloco ul{list-style:none;margin:0;padding:0}
      .fimbloco li{position:relative;font-size:15.5px;line-height:1.5;padding:5px 0 5px 22px;border-bottom:1px dashed rgba(255,255,255,.07)}
      .fimbloco li:last-child{border-bottom:none}
      .fimbloco li::before{content:"◆";position:absolute;left:2px;top:10px;font-size:8px;color:var(--gold)}
      .fimbloco li b{color:var(--gold2);font-weight:700}
      .bic{display:inline-flex;vertical-align:-2px;margin-right:7px;flex:0 0 auto}
      .bic svg{width:14px;height:14px;display:block}
      .sealrow{margin-top:9px}
      .blockseal{
        display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.6px;
        color:var(--gold2);border:1px solid var(--line);border-radius:99px;
        padding:4px 11px;background:rgba(212,175,55,.07);text-transform:uppercase;
      }
      .kicker{color:var(--red2);font-size:12px;font-weight:700;letter-spacing:2.2px;text-transform:uppercase;margin:0 0 6px}
      .kicker::before{content:"◆";font-size:8px;vertical-align:2px;margin-right:7px;color:var(--gold)}
      h2{font-family:"Playfair Display",Georgia,serif;font-size:25px;line-height:1.22;margin:0 0 12px;font-weight:700}
      p{font-size:16.5px;line-height:1.62;margin:0 0 12px;color:var(--ink)}
      p.lead{font-size:17.5px;color:#faf5ff}
      ul.tight{list-style:none;margin:4px 0 14px;padding:0}
      ul.tight li{
        position:relative;font-size:16.5px;line-height:1.55;
        padding:7px 0 7px 24px;border-bottom:1px dashed rgba(255,255,255,.07);
      }
      ul.tight li:last-child{border-bottom:none}
      ul.tight li::before{content:"◆";position:absolute;left:2px;top:12px;font-size:8px;color:var(--gold)}
      ul.tight li b, p b{color:var(--gold2);font-weight:700}
      .box{
        background:var(--panel);border:1px solid var(--line);border-radius:14px;
        padding:14px 16px;margin:14px 0;
      }
      .box .blabel{color:var(--red2);font-size:11.5px;font-weight:700;letter-spacing:1.8px;margin:0 0 6px}
      .box p{margin:0;font-size:15.5px}
      .box p + p{margin-top:8px}
      .box.lei p{font-family:"Playfair Display",Georgia,serif;font-size:16.5px;line-height:1.55;font-style:italic}
      .box.exemplo{position:relative;overflow:hidden}
      .box.exemplo .wm{
        position:absolute;top:0;right:0;width:74%;height:100%;object-fit:cover;
        opacity:.15;mix-blend-mode:screen;pointer-events:none;
        -webkit-mask-image:linear-gradient(to left,#000 40%,transparent 96%);
        mask-image:linear-gradient(to left,#000 40%,transparent 96%);
      }
      .box.exemplo .excontent{position:relative;z-index:1}
      .viarow{display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:13px 14px;margin:10px 0}
      .vianum{
        flex:0 0 auto;width:40px;height:40px;border-radius:50%;
        border:1.5px solid var(--red);color:var(--red2);
        display:flex;align-items:center;justify-content:center;
        font-family:"Playfair Display",serif;font-weight:700;font-size:16px;
      }
      .viarow h3{margin:2px 0 3px;font-size:17px;font-weight:700}
      .viarow p{margin:0;font-size:15px;color:var(--muted);line-height:1.5}
      .chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
      .chip{border:1px solid var(--line);color:var(--gold2);border-radius:99px;padding:6px 12px;font-size:13.5px;font-weight:600;background:rgba(212,175,55,.07)}
      .audio{
        margin:0 0 16px;background:#2a1245;border:1px solid rgba(168,110,230,.4);
        border-radius:16px;padding:13px 15px 12px;cursor:pointer;
      }
      .audio .arow{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}
      .audio .alabel{color:var(--red2);font-size:11.5px;font-weight:700;letter-spacing:1.8px}
      .audio .atime{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
      .audio .acontrol{display:flex;align-items:center;gap:12px}
      .playbtn{
        flex:0 0 auto;width:46px;height:46px;border-radius:50%;
        background:linear-gradient(180deg,#cdb2ff,#7d3cbf);
        border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;
        box-shadow:0 4px 14px rgba(168,110,230,.4);
      }
      .playbtn svg{width:20px;height:20px;fill:#fff}
      .atrack{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.14);overflow:hidden;cursor:pointer}
      .afill{height:100%;width:0%;background:linear-gradient(90deg,var(--red),var(--gold))}
      .qtext{font-size:17.5px;line-height:1.6;margin-bottom:14px}
      .opt{
        display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
        background:var(--panel2);border:1.5px solid rgba(255,255,255,.12);color:var(--ink);
        border-radius:13px;padding:13px 14px;margin:9px 0;font-size:16px;line-height:1.45;
        font-family:inherit;cursor:pointer;transition:border-color .15s,background .15s;
      }
      .opt:hover{border-color:rgba(168,110,230,.65)}
      .opt .letter{
        flex:0 0 auto;width:27px;height:27px;border-radius:8px;margin-top:1px;
        border:1.5px solid var(--red);color:var(--red2);
        display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
      }
      .opt.correct{border-color:var(--ok);background:rgba(62,207,122,.12)}
      .opt.correct .letter{border-color:var(--ok);color:var(--ok)}
      .opt.wrong{border-color:var(--bad);background:rgba(255,122,122,.1)}
      .opt.wrong .letter{border-color:var(--bad);color:var(--bad)}
      .opt:disabled{cursor:default;opacity:.92}
      .feedback{display:none;border-radius:13px;padding:13px 15px;margin-top:13px;font-size:15.5px;line-height:1.55}
      .feedback.show{display:block}
      .feedback.good{background:rgba(62,207,122,.13);border:1px solid rgba(62,207,122,.5)}
      .feedback.bad{background:rgba(255,122,122,.1);border:1px solid rgba(255,122,122,.45)}
      .feedback b{display:block;margin-bottom:3px;font-size:16px}
      .flashwrap{perspective:1200px;margin:6px 0 4px}
      .flash{
        position:relative;width:100%;min-height:250px;cursor:pointer;
        transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.3,1);
      }
      .flash.flipped{transform:rotateY(180deg)}
      .face{
        position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
        border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;justify-content:center;
      }
      .face.front{background:linear-gradient(160deg,#2e1849,#1a0a2e);border:1.5px solid var(--line);text-align:center;align-items:center}
      .face.back{background:linear-gradient(160deg,#37205a,#241040);border:1.5px solid var(--red);transform:rotateY(180deg)}
      .face .flabel{color:var(--red2);font-size:11.5px;font-weight:700;letter-spacing:2px;margin-bottom:12px}
      .face.front .fq{font-family:"Playfair Display",serif;font-size:21px;line-height:1.4}
      .face.back p{font-size:16px;line-height:1.6;margin:0}
      .face.back p b{color:var(--gold2)}
      .tap{margin-top:16px;color:var(--muted);font-size:13px}
      .matchscore{color:var(--muted);font-size:14.5px;margin-bottom:10px}
      .matchscore b{color:var(--gold2)}
      .matchgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
      .mbtn{
        background:var(--panel2);border:1.5px solid rgba(255,255,255,.12);color:var(--ink);
        border-radius:12px;padding:11px 11px;font-size:14.5px;line-height:1.4;font-family:inherit;
        cursor:pointer;text-align:left;transition:border-color .15s,background .15s;
      }
      .mbtn.sel{border-color:var(--red);background:rgba(168,110,230,.16)}
      .mbtn.done{border-color:var(--ok);background:rgba(62,207,122,.12);color:#c9f2da;cursor:default}
      .mbtn.shake{animation:shake .35s}
      @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
      .matchdone{display:none;margin-top:14px;background:rgba(62,207,122,.13);border:1px solid rgba(62,207,122,.5);border-radius:13px;padding:13px 15px;font-size:15.5px}
      .matchdone.show{display:block}
      table.cmp{width:100%;border-collapse:collapse;margin:8px 0 6px;font-size:14px}
      table.cmp th{
        background:#2e1849;color:var(--gold2);text-align:left;padding:10px 9px;
        font-size:13px;letter-spacing:.4px;border-bottom:2px solid var(--red);
      }
      table.cmp td{padding:10px 9px;border-bottom:1px solid rgba(255,255,255,.09);line-height:1.45;vertical-align:top}
      table.cmp td.t{font-weight:700;color:var(--gold2)}
      .explorebox{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin:4px 0 12px;background:#22103a}
      .explorebox img{width:100%;display:block}
      .hotspot{
        position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;
        background:rgba(16,6,28,.85);border:2px solid var(--gold);color:var(--gold2);
        font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;z-index:2;
        display:flex;align-items:center;justify-content:center;
      }
      .hotspot::after{
        content:"";position:absolute;inset:-2px;border-radius:50%;
        border:2px solid rgba(212,175,55,.8);animation:pulse 1.8s ease-out infinite;pointer-events:none;
      }
      @keyframes pulse{0%{transform:scale(1);opacity:.9}70%{transform:scale(1.7);opacity:0}100%{transform:scale(1.7);opacity:0}}
      .hotspot.active{background:linear-gradient(180deg,#cdb2ff,#7d3cbf);border-color:#fff;color:#fff}
      .hotspot.active::after{display:none}
      .hotspot.seen{background:var(--gold);color:#241040;border-color:var(--gold2)}
      .hotspot.seen::after{animation:none;opacity:0}
      .explorecount{color:var(--muted);font-size:14.5px;margin:0 0 10px}
      .explorecount b{color:var(--gold2)}
      .hotpanel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 6px}
      .hotpanel h3{margin:0 0 6px;font-size:18px;font-family:"Playfair Display",serif;font-weight:700}
      .hotpanel p{margin:0;font-size:15.5px}
      .explorehint{color:var(--muted);font-size:15px;margin:0}
      .revealcard{
        display:block;width:100%;text-align:left;cursor:pointer;color:var(--ink);font-family:inherit;
        background:linear-gradient(160deg,#2e1849,#1a0a2e);border:1.5px solid var(--line);
        border-radius:14px;padding:15px 16px;margin:10px 0;
      }
      .revealcard .rlabel{color:var(--red2);font-size:11.5px;font-weight:700;letter-spacing:1.8px;margin:0 0 6px}
      .revealcard .rbody{font-size:16px;line-height:1.55;margin:0}
      .revealcard .rbody b{color:var(--gold2)}
      .revealcard .rhint{color:var(--muted);font-size:13px;margin:8px 0 0}
      .revealcard.open{border-color:var(--red)}
      .revealcard.done{border-color:var(--gold);background:linear-gradient(160deg,#331d52,#241040);cursor:default}
      .revealcard.done .rlabel{color:var(--gold2)}
      .timeline{position:relative;margin:8px 0 4px;padding-left:30px}
      .timeline::before{content:"";position:absolute;left:12px;top:8px;bottom:8px;width:2px;background:linear-gradient(180deg,var(--gold),var(--red))}
      .tlitem{position:relative;margin-bottom:10px}
      .tlbtn{
        width:100%;text-align:left;background:var(--panel2);border:1.5px solid rgba(255,255,255,.12);
        color:var(--ink);border-radius:12px;padding:11px 13px;font-family:inherit;cursor:pointer;
        display:flex;gap:11px;align-items:baseline;
      }
      .tlbtn::before{
        content:"";position:absolute;left:-24px;top:16px;width:11px;height:11px;border-radius:50%;
        background:#180b28;border:2.5px solid var(--gold);
      }
      .tlbtn.open{border-color:var(--gold)}
      .tlbtn.open::before{background:var(--gold)}
      .tlyear{font-family:"Playfair Display",serif;font-weight:800;color:var(--gold2);font-size:16px;white-space:nowrap}
      .tltitle{font-size:15.5px;font-weight:600;line-height:1.35}
      .tlbody{display:none;background:var(--panel);border:1px solid var(--line);border-radius:0 0 12px 12px;border-top:none;padding:4px 13px 12px;margin-top:-6px}
      .tlbody.show{display:block}
      .tlbody p{font-size:15px;margin:6px 0 2px}
      .vfstage{position:relative;margin:6px 0 4px;touch-action:pan-y}
      .vfcard{
        background:linear-gradient(160deg,#2e1849,#1a0a2e);border:1.5px solid var(--line);border-radius:16px;
        padding:20px 18px;min-height:150px;display:flex;flex-direction:column;justify-content:center;
        cursor:grab;user-select:none;-webkit-user-select:none;position:relative;
      }
      .vfcard .vflabel{color:var(--red2);font-size:11.5px;font-weight:700;letter-spacing:1.8px;margin:0 0 8px}
      .vfcard .vftext{font-size:17.5px;line-height:1.55;margin:0;font-family:"Playfair Display",serif}
      .vfstamp{
        position:absolute;top:14px;font-weight:800;font-size:14px;letter-spacing:1.5px;
        border:2.5px solid;border-radius:8px;padding:3px 9px;opacity:0;transform:rotate(-8deg);
      }
      .vfstamp.f{left:14px;color:var(--bad);border-color:var(--bad)}
      .vfstamp.v{right:14px;color:var(--ok);border-color:var(--ok);transform:rotate(8deg)}
      .vfbtns{display:flex;gap:10px;margin-top:12px}
      .vfbtn{

    "corpo": "<p>Começo pela pergunta mais simples e mais importante do capítulo: o que são as <b class=\"term\">fontes do Direito</b>? Fonte é o meio pelo qual o Direito se forma e estabelece as suas regras. Pense numa nascente de rio: é dali que a água brota e passa a correr. Com o Direito é parecido: a fonte é o ponto de onde a regra nasce e passa a valer para a vida das pessoas.</p><div class=\"vazada\" aria-hidden=\"true\"><img src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-do-trabalho/01-introducao/aula-01-fontes-materiais-formais/imagens/origem.webp\" alt=\"\"></div><p>Mas atenção a um detalhe que a prova adora: <b>nem tudo que gera Direito é fonte</b>. O contrato de trabalho, por exemplo, cria obrigações entre aquele empregado e aquele empregador, mas ele não é fonte no sentido que estudamos aqui. Para ser fonte, a regra precisa ter <b>caráter geral, abstrato, impessoal e imperativo</b>: valer para todos de uma categoria, sem nome e sem rosto, e com força de comando.</p><p>E por que conhecer as fontes importa tanto? Porque empregado e empregador precisam estar conscientes de que <b>o contrato de trabalho não é a única regra</b> a que devem se submeter. Acima e ao redor do contrato existe um conjunto inteiro de fontes mandando na relação de trabalho.</p><div class=\"box exemplo\"><img class=\"wm\" src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-do-trabalho/01-introducao/aula-01-fontes-materiais-formais/imagens/origem.webp\" alt=\"\" aria-hidden=\"true\"><div class=\"excontent\"><p class=\"blabel\">PENSE ASSIM</p><p>Imagine o contrato como o combinado dentro de uma casa. As fontes são as regras do condomínio, da rua e da cidade: você pode combinar muita coisa dentro de casa, mas não pode ignorar o que vale para todos lá fora.</p></div></div>",
    "narr": "Fontes: os meios pelos quais o Direito se forma. Começo pela pergunta mais simples e mais importante do capítulo: o que são as fontes do Direito? Fonte é o meio pelo qual o Direito se forma e estabelece as suas regras. Pense numa nascente de rio: é dali que a água brota e passa a correr. Com o Direito é parecido: a fonte é o ponto de onde a regra nasce e passa a valer para a vida das pessoas. Mas atenção a um detalhe que a prova adora: nem tudo que gera Direito é fonte. O contrato de trabalho, por exemplo, cria obrigações entre aquele empregado e aquele empregador, mas ele não é fonte no sentido que estudamos aqui. Para ser fonte, a regra precisa ter caráter geral, abstrato, impessoal e imperativo: valer para todos de uma categoria, sem nome e sem rosto, e com força de comando. E por que conhecer as fontes importa tanto? Porque empregado e empregador precisam estar conscientes de que o contrato de trabalho não é a única regra a que devem se submeter. Acima e ao redor do contrato existe um conjunto inteiro de fontes mandando na relação de trabalho. PENSE ASSIM: Imagine o contrato como o combinado dentro de uma casa. As fontes são as regras do condomínio, da rua e da cidade: você pode combinar muita coisa dentro de casa, mas não pode ignorar o que vale para todos lá fora."

nte é o meio pelo qual o Direito se forma: para ser fonte, a regra tem caráter geral, abstrato, impessoal e imperativo, e o contrato de trabalho, sozinho, não é fonte nesse sentido.</li><li>As fontes materiais moram na sociedade: são os fatos e os valores que ocasionam o surgimento das normas, como protestos, reivindicações e paralisações.</li><li>Dica de memória: o M de material é o M de movimento social, a ebulição que influencia a confecção das leis.</li></ul></div>",
    "narr": "Fontes materiais: os fatos e os valores que fazem a norma nascer. As fontes materiais são encontradas na sociedade. Elas são um complexo de fatores que ocasionam o surgimento das normas, envolvendo fatos e valores que o Direito tenta realizar. Em linguagem simples: antes de a regra existir no papel, ela existe como pressão, necessidade e desejo coletivo na vida real. Os exemplos clássicos são os protestos, as reivindicações e as paralisações dos trabalhadores. É uma espécie de ebulição social que influencia a confecção das leis: a sociedade ferve, e dessa fervura o legislador recolhe os ingredientes da norma futura. Guarde a dica de memória que o próprio tema oferece: o M de material é o mesmo M de movimento social. Se a questão falar de movimento, pressão e fato social que empurra a lei, ela está falando de fonte material, e não de uma regra pronta para obrigar. EXEmedida provisóriaLO PRÁTICO: Trabalhadores de uma categoria paralisam as atividades pedindo um piso salarial digno. A paralisação, por si só, não é uma regra que um juiz aplique: ela é fonte material, a força social que pode, mais adiante, se transformar em lei ou em negociação coletiva. Fonte material é a fervura social: fatos e valores que ocasionam a norma. M de material, M de movimento social."

    "titulo": "Fontes formais: o Direito com força de comando",
    "corpo": "<p>Se as fontes materiais são a fervura, as <b class=\"term\">fontes formais</b> são a regra pronta. Elas são <b>tipicamente jurídicas</b>: comandos <b>gerais, abstratos, impessoais e imperativos</b>, que conferem à norma o <b>caráter coercitivo</b>, aquele que obriga os indivíduos a um determinado comando.</p><div class=\"vazada\" aria-hidden=\"true\"><img src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-do-trabalho/01-introducao/aula-01-fontes-materiais-formais/imagens/formais.webp\" alt=\"\"></div><p>Em outras palavras, a fonte formal é <b>como o Direito é colocado em prática na sociedade</b>. Ela faz duas coisas ao mesmo tempo: estabelece um <b>padrão de comportamento</b> para os indivíduos e fixa o <b>modo pelo qual se devem produzir e modificar as normas</b>. É a diferença entre o desejo coletivo e a ordem que pode ser cobrada.</p><p>Repare no caminho completo: a fonte material explica <b>por que</b> a norma nasceu; a fonte formal é <b>a norma em forma de comando</b>, pronta para valer, ser aplicada e ser exigida.</p><div class=\"box exemplo\"><img class=\"wm\" src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-do-trabalho/01-introducao/aula-01-fontes-materiais-formais/imagens/formais.webp\" alt=\"\" aria-hidden=\"true\"><div class=\"excontent\"><p class=\"blabel\">PENSE ASSIM</p><p>A fonte material é a receita sendo inventada na cozinha, no meio da conversa e da necessidade. A fonte formal é a receita escrita, publicada e pendurada na parede: a partir dali, ela manda no preparo e pode ser cobrada de quem cozinha.</p></div></div>",
    "narr": "Fontes formais: o Direito com força de comando. Se as fontes materiais são a fervura, as fontes formais são a regra pronta. Elas são tipicamente jurídicas: comandos gerais, abstratos, impessoais e imperativos, que conferem à norma o caráter coercitivo, aquele que obriga os indivíduos a um determinado comando. Em outras palavras, a fonte formal é como o Direito é colocado em prática na sociedade. Ela faz duas coisas ao mesmo tempo: estabelece um padrão de comportamento para os indivíduos e fixa o modo pelo qual se devem produzir e modificar as normas. É a diferença entre o desejo coletivo e a ordem que pode ser cobrada. Repare no caminho completo: a fonte material explica por que a norma nasceu; a fonte formal é a norma em forma de comando, pronta para valer, ser aplicada e ser exigida. PENSE ASSIM: A fonte material é a receita sendo inventada na cozinha, no meio da conversa e da necessidade. A fonte formal é a receita escrita, publicada e pendurada na parede: a partir dali, ela manda no preparo e pode ser cobrada de quem cozinha."

    "corpo": "<p>As fontes formais se dividem em <b>dois grandes grupos</b>, e o critério da divisão é uma pergunta só: <b>quem cria a regra</b>? Se a regra é criada pelos <b>próprios interessados</b> nela, sem intervenção do Estado, ela é <b class=\"term\">autônoma</b>. Se é criada pelo <b>Estado</b>, ela é <b class=\"term\">heterônoma</b>.</p><div class=\"vazada\" aria-hidden=\"true\"><img src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-do-trabalho/01-introducao/aula-01-fontes-materiais-formais/imagens/norma.webp\" alt=\"\"></div><p>Nos dois casos, a regra é formal: geral, abstrata, impessoal e imperativa. O que muda é a <b>autoria</b>. Nas autônomas, o poder de criar a norma está nas mãos dos particulares, e esse poder tem nome: <b>autonomia coletiva dos particulares</b>. Nas heterônomas, o autor é o poder público, com suas instituições e seus processos próprios.</p><p>Nas próximas etapas, eu abro cada grupo com calma: primeiro as autônomas, com seus exemplos e seus limites; depois as heterônomas, com a lista das criações do Estado.</p><div class=\"frasechave\"><p class=\"flabel\">FRASE-CHAVE</p><p class=\"fq2\">Fonte formal se divide pela autoria: criada pelos interessados, é autônoma; criada pelo Estado, é heterônoma.</p></div>",
    "narr": "Autônomas e heterônomas: quem cria a regra?. As fontes formais se dividem em dois grandes grupos, e o critério da divisão é uma pergunta só: quem cria a regra? Se a regra é criada pelos próprios interessados nela, sem intervenção do Estado, ela é autônoma. Se é criada pelo Estado, ela é heterônoma. Nos dois casos, a regra é formal: geral, abstrata, impessoal e imperativa. O que muda é a autoria. Nas autônomas, o poder de criar a norma está nas mãos dos particulares, e esse poder tem nome: autonomia coletiva dos particulares. Nas heterônomas, o autor é o poder público, com suas instituições e seus processos próprios. Nas próximas etapas, eu abro cada grupo com calma: primeiro as autônomas, com seus exemplos e seus limites; depois as heterônomas, com a lista das criações do Estado. Fonte formal se divide pela autoria: criada pelos interessados, é autônoma; criada pelo Estado, é heterônoma."

essados; heterônomas, pelo Estado.</li><li>São autônomas o acordo coletivo, o regulamento de empresa e o costume, sempre limitados pela Constituição Federal.</li></ul></div>",

    "corpo": "<p>Volto ao limite das fontes autônomas, porque ele merece uma etapa própria. A regra criada pelos interessados vale muito, mas ela vive <b>debaixo da Constituição Federal</b>. Nenhum acordo, regulamento ou costume pode passar por cima do texto constitucional.</p><div class=\"vazada\" aria-hidden=\"true\"><img src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-do-trabalho/01-introducao/aula-01-fontes-materiais-formais/imagens/autonomas.webp\" alt=\"\"></div><p>Dentro desse teto, porém, há espaço de manobra protetiva: a fonte autônoma pode <b>contrariar a CLT em benefício do trabalhador</b>, quando a Constituição permite. É o sistema dizendo: a lei comum é o piso de proteção, e a negociação pode subir a partir dele, mas ninguém desce abaixo da Constituição.</p><p>Guarde a imagem do prédio de três andares: a Constituição no topo, a CLT no meio e a negociação coletiva construindo os seus cômodos sem furar o telhado.</p><div class=\"frasechave\"><p class=\"flabel\">FRASE-CHAVE</p><p class=\"fq2\">A Constituição é o teto das fontes autônomas: abaixo dele, a negociação pode até superar a CLT em benefício do trabalhador.</p></div>",
    "narr": "O teto das autônomas: a Constituição manda por cima. Volto ao limite das fontes autônomas, porque ele merece uma etapa própria. A regra criada pelos interessados vale muito, mas ela vive debaixo da Constituição Federal. Nenhum acordo, regulamento ou costume pode passar por cima do texto constitucional. Dentro desse teto, porém, há espaço de manobra protetiva: a fonte autônoma pode contrariar a Consolidação das Leis do Trabalho em benefício do trabalhador, quando a Constituição permite. É o sistema dizendo: a lei comum é o piso de proteção, e a negociação pode subir a partir dele, mas ninguém desce abaixo da Constituição. Guarde a imagem do prédio de três andares: a Constituição no topo, a Consolidação das Leis do Trabalho no meio e a negociação coletiva construindo os seus cômodos sem furar o telhado. A Constituição é o teto das fontes autônomas: abaixo dele, a negociação pode até superar a Consolidação das Leis do Trabalho em benefício do trabalhador."

    "corpo": "<p>Um detalhe bonito das fontes heterônomas: o Estado não escreve com uma mão só. A <b>Constituição</b> e as <b>leis</b> nascem do processo legislativo; os <b>decretos</b> são expedidos pelo Poder Executivo; a <b>sentença normativa</b> e as <b>súmulas vinculantes</b> vêm do Poder Judiciário.</p><div class=\"vazada\" aria-hidden=\"true\"><img src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-do-trabalho/01-introducao/aula-01-fontes-materiais-formais/imagens/heteronomas.webp\" alt=\"\"></div><p>Isso significa que, no mundo do trabalho, os <b>três Poderes</b> produzem regras formais. O juiz que julga o dissídio coletivo, por exemplo, não apenas resolve um caso: com a sentença normativa, ele cria comando geral para uma categoria inteira.</p><p>Para a prova, o macete é de autoria: se quem criou foi qualquer braço do Estado, a classificação é a mesma, <b>fonte formal heterônoma</b>, não importa qual Poder assinou.</p><div class=\"box exemplo\"><img class=\"wm\" src=\"https://pub-571d075cadcb4d2196a6545456271ce4.r2.dev/aulas-interativas/direito-do-trabalho/01-introducao/aula-01-fontes-materiais-formais/imagens/heteronomas.webp\" alt=\"\" aria-hidden=\"true\"><div class=\"excontent\"><p class=\"blabel\">EXEMPLO PRÁTICO</p><p>Um decreto do Executivo regulamenta uma lei trabalhista. Embora não seja uma lei votada pelo Legislativo, ele é fonte heterônoma: o autor é o Estado, e o comando é geral e obrigatório.</p></div></div>",

        if(!state[idx]) state[idx] = {cur:0, score:0, answered:false, chosen:null, done:false};

      } else if(s.tipo === "Comparador"){

      } else if(s.tipo === "Completar"){

    function bindAudio(){
      var playBtn = document.getElementById("playBtn");
      var box = document.getElementById("audioBox");
      var track = document.getElementById("aTrack");
      playBtn.addEventListener("click", function(ev){
        ev.stopPropagation();
        unlocked = true;
        togglePlay();
      });
      track.addEventListener("click", function(ev){
        ev.stopPropagation();
        var r = track.getBoundingClientRect();
        if(player.duration){
          player.currentTime = player.duration * ((ev.clientX - r.left) / r.width);
        }
      });
      box.addEventListener("mouseenter", function(){
        if(player.paused){ tryPlay(); }
      });
    }

    function tryPlay(){
      var p = player.play();
      if(p && p.catch){ p.catch(function(){}); }
    }
    function togglePlay(){
      if(player.paused){ tryPlay(); } else { player.pause(); }
    }

    player.addEventListener("play", function(){
      var b = document.getElementById("playBtn");
      if(b) b.innerHTML = ICON_PAUSE;
    });
    player.addEventListener("pause", function(){
      var b = document.getElementById("playBtn");
      if(b) b.innerHTML = ICON_PLAY;
    });
    player.addEventListener("timeupdate", function(){
      var f = document.getElementById("aFill");
      var t = document.getElementById("aTime");
      if(f && player.duration) f.style.width = (100 * player.currentTime / player.duration) + "%";
      if(t) t.textContent = fmt(player.currentTime) + " / " + fmt(player.duration);
      karaSync();
    });
    player.addEventListener("loadedmetadata", function(){
      var t = document.getElementById("aTime");
      if(t) t.textContent = "0:00 / " + fmt(player.duration);
    });
    player.addEventListener("ended", function(){
      var f = document.getElementById("aFill");
      if(f) f.style.width = "0%";
    });

    function bindInteractions(s){
      if(s.tipo === "Questão" || s.tipo === "Questão de banca"){
        var answered = state[idx] && state[idx].answered;
        var opts = scrollArea.querySelectorAll(".opt");
        var fb = document.getElementById("feedback");
        function paint(chosen){
          opts.forEach(function(o){
            var oi = parseInt(o.getAttribute("data-opt"), 10);
            o.disabled = true;
            if(oi === s.certa) o.classList.add("correct");
            else if(oi === chosen) o.classList.add("wrong");
          });
          fb.className = "feedback show " + (chosen === s.certa ? "good" : "bad");
          fb.innerHTML = "<b>" + (chosen === s.certa ? "Resposta certa!" : "Não foi dessa vez.") + "</b>" + s.feedback;
        }
        if(answered){ paint(state[idx].chosen); }
        opts.forEach(function(o){
          o.addEventListener("click", function(){
            if(state[idx] && state[idx].answered) return;
            var oi = parseInt(o.getAttribute("data-opt"), 10);
            state[idx] = {answered:true, chosen:oi};
            paint(oi);
          });
        });
      } else if(s.tipo === "Flashcard"){
        var card = document.getElementById("flashCard");
        card.addEventListener("click", function(){ card.classList.toggle("flipped"); });
      } else if(s.tipo === "Ligar termos"){
        var st = state[idx];
        var terms = scrollArea.querySelectorAll(".term");
        var defs = scrollArea.querySelectorAll(".def");
        function select(el, group){
          if(el.classList.contains("done")) return;
          var groupBtns = group === "t" ? terms : defs;
          groupBtns.forEach(function(b){ b.classList.remove("sel"); });
          el.classList.add("sel");
          if(group === "t") st.selT = parseInt(el.getAttribute("data-term"), 10);
          else st.selD = parseInt(el.getAttribute("data-def"), 10);
          checkMatch();
        }
        function checkMatch(){
          if(st.selT === null || st.selT === undefined || st.selD === null || st.selD === undefined) return;
          var tBtn = scrollArea.querySelector('.term[data-term="' + st.selT + '"]');
          var dBtn = scrollArea.querySelector('.def[data-def="' + st.selD + '"]');
          if(st.selT === st.selD){
            st.done[st.selT] = true;
            st.count++;
            tBtn.classList.add("done"); dBtn.classList.add("done");
            tBtn.classList.remove("sel"); dBtn.classList.remove("sel");
            var mc = document.getElementById("matchCount");
            if(mc) mc.textContent = st.count + " de " + s.pares.length;
            if(st.count === s.pares.length){
              var md = document.getElementById("matchDone");
              if(md) md.classList.add("show");
            }
          } else {
            [tBtn, dBtn].forEach(function(b){
              b.classList.add("shake");
              setTimeout(function(){ b.classList.remove("shake", "sel"); }, 380);
            });
          }
          st.selT = null; st.selD = null;
        }
        terms.forEach(function(b){ b.addEventListener("click", function(){ select(b, "t"); }); });
        defs.forEach(function(b){ b.addEventListener("click", function(){ select(b, "d"); }); });
      } else if(s.tipo === "Explorar"){
        var es = state[idx];
        var hots = scrollArea.querySelectorAll(".hotspot");
        hots.forEach(function(b){
          b.addEventListener("click", function(){
            var pi = parseInt(b.getAttribute("data-hot"), 10);
            if(!es.seen[pi]){ es.seen[pi] = true; es.count++; }
            es.cur = pi;
            var ec = document.getElementById("exploreCount");
            if(ec) ec.textContent = es.count + " de " + s.pontos.length;
            var panel = document.getElementById("hotPanel");
            if(panel) panel.innerHTML = hotPanelHTML(s, es);
            hots.forEach(function(o){
              var oi = parseInt(o.getAttribute("data-hot"), 10);
              var isCur = oi === pi;
              var isSeen = !!es.seen[oi] && !isCur;
              o.classList.toggle("active", isCur);
              o.classList.toggle("seen", isSeen);
              o.textContent = isSeen ? "✓" : (oi + 1);
            });
            if(panel) panel.scrollIntoView({behavior:"smooth", block:"nearest"});
          });
        });
      } else if(s.tipo === "Toque e revele"){
        var rs = state[idx];
        var cards = scrollArea.querySelectorAll(".revealcard");
        cards.forEach(function(card){
          card.addEventListener("click", function(){
            var ci = parseInt(card.getAttribute("data-card"), 10);
            var stage = rs.stage[ci] || 0;
            if(stage >= 2) return;
            stage++;
            rs.stage[ci] = stage;
            var c = s.cartas[ci];
            if(stage === 2){
              rs.count++;
              var rc = document.getElementById("revealCount");
              if(rc) rc.textContent = rs.count + " de " + s.cartas.length;
              card.classList.remove("open");
              card.classList.add("done");
              card.innerHTML = '<p class="rlabel">RESPOSTA</p><p class="rbody">' + c.r + '</p>';
            } else {
              card.classList.add("open");
              card.innerHTML = '<p class="rlabel">PERGUNTA</p><p class="rbody">' + c.p + '</p><p class="rhint">Pensou? Toque de novo para revelar a resposta</p>';
            }
          });
        });
      } else if(s.tipo === "Linha do tempo"){
        var ts = state[idx];
        scrollArea.querySelectorAll(".tlbtn").forEach(function(b){
          b.addEventListener("click", function(){
            var mi = parseInt(b.getAttribute("data-tl"), 10);
            var body = document.getElementById("tlBody" + mi);
            var opening = !body.classList.contains("show");
            body.classList.toggle("show", opening);
            b.classList.toggle("open", opening);
            ts.open[mi] = opening;
            if(opening && !b.getAttribute("data-counted")){
              b.setAttribute("data-counted", "1");
              ts.count++;
              var tc = document.getElementById("tlCount");
              if(tc) tc.textContent = ts.count + " de " + s.marcos.length;
            }
          });
        });
      } else if(s.tipo === "Verdadeiro ou falso"){
        var vst = state[idx];
        var vfArea = document.getElementById("vfArea");
        function renderVF(){
          if(vst.done){
            vfArea.innerHTML = '<div class="finalscore"><p>Você acertou</p><p class="big">' + vst.score + ' de ' + s.afirmacoes.length + '</p><p>' + (vst.score === s.afirmacoes.length ? "Perfeito! Nenhuma armadilha te derrubou." : vst.score >= 3 ? "Muito bem! O homem de trás já não se esconde de você." : "Bom treino! Volte às cartas com calma depois de rever as explicações das etapas.") + '</p></div>';
            return;
          }
          var a = s.afirmacoes[vst.cur];
          var h = '<p class="matchscore">Carta <b>' + (vst.cur + 1) + ' de ' + s.afirmacoes.length + '</b> · Acertos: <b>' + vst.score + '</b></p>';
          h += '<div class="vfstage"><div class="vfcard" id="vfCard"><span class="vfstamp f" id="stampF">FALSO</span><span class="vfstamp v" id="stampV">VERDADEIRO</span><p class="vflabel">AFIRMAÇÃO</p><p class="vftext">' + a.t + '</p></div></div>';
          if(!vst.answered){
            h += '<div class="vfbtns"><button class="vfbtn f" type="button" id="vfFalse">← Falso</button><button class="vfbtn v" type="button" id="vfTrue">Verdadeiro →</button></div>';
            h += '<p class="explorehint" style="margin-top:10px">Você também pode arrastar a carta para o lado da sua resposta.</p>';
          } else {
            h += '<div class="feedback show ' + (vst.chosen === a.v ? 'good' : 'bad') + '"><b>' + (vst.chosen === a.v ? "Acertou! " : "Não foi dessa vez. ") + (a.v ? "É verdadeira." : "É falsa.") + '</b>' + a.exp + '</div>';
            h += '<button class="againbtn" type="button" id="vfNext" style="width:100%">' + (vst.cur === s.afirmacoes.length - 1 ? "Ver o resultado" : "Próxima carta →") + '</button>';
          }
          vfArea.innerHTML = h;
          bindVFCard();
        }
        function answerVF(choice){
          if(vst.answered) return;
          var a = s.afirmacoes[vst.cur];
          vst.answered = true;
          vst.chosen = choice;
          if(choice === a.v) vst.score++;
          renderVF();
        }
        function bindVFCard(){
          var card = document.getElementById("vfCard");
          var bF = document.getElementById("vfFalse");
          var bT = document.getElementById("vfTrue");
          var bN = document.getElementById("vfNext");
          if(bF) bF.addEventListener("click", function(){ answerVF(false); });
          if(bT) bT.addEventListener("click", function(){ answerVF(true); });
          if(bN) bN.addEventListener("click", function(){
            if(vst.cur === s.afirmacoes.length - 1){ vst.done = true; }
            else { vst.cur++; vst.answered = false; vst.chosen = null; }
            renderVF();
          });
          if(!card || vst.answered) return;
          card.addEventListener("touchstart", function(ev){ ev.stopPropagation(); }, {passive:true});
          card.addEventListener("touchend", function(ev){ ev.stopPropagation(); }, {passive:true});
          var startX = null, dx = 0;
          var stampF = document.getElementById("stampF");
          var stampV = document.getElementById("stampV");
          card.addEventListener("pointerdown", function(ev){
            startX = ev.clientX; dx = 0;
            try{ card.setPointerCapture(ev.pointerId); }catch(e){}
          });
          card.addEventListener("pointermove", function(ev){
            if(startX === null) return;
            dx = ev.clientX - startX;
            card.style.transform = "translateX(" + dx + "px) rotate(" + (dx / 22) + "deg)";
            if(stampV) stampV.style.opacity = dx > 12 ? Math.min(1, dx / 80) : 0;
            if(stampF) stampF.style.opacity = dx < -12 ? Math.min(1, -dx / 80) : 0;
          });
          card.addEventListener("pointerup", function(){
            if(startX === null) return;
            var finalDx = dx;
            startX = null;
            card.style.transform = "";
            if(stampV) stampV.style.opacity = 0;
            if(stampF) stampF.style.opacity = 0;
            if(finalDx > 70) answerVF(true);
            else if(finalDx < -70) answerVF(false);
          });
          card.addEventListener("pointercancel", function(){
            startX = null;
            card.style.transform = "";
          });
        }
        renderVF();
      } else if(s.tipo === "Comparador"){
        var top = document.getElementById("cmpTop");

        var range = document.getElementById("cmpRange");
        var box = document.getElementById("cmpBox");
        function setCmp(v){
          v = Math.max(0, Math.min(100, v));
          top.style.clipPath = "inset(0 0 0 " + v + "%)";
          handle.style.left = v + "%";
          range.value = v;
        }
        range.addEventListener("input", function(){ setCmp(parseFloat(range.value)); });
        range.addEventListener("touchstart", function(ev){ ev.stopPropagation(); }, {passive:true});
        range.addEventListener("touchend", function(ev){ ev.stopPropagation(); }, {passive:true});
        box.addEventListener("touchstart", function(ev){ ev.stopPropagation(); }, {passive:true});
        box.addEventListener("touchend", function(ev){ ev.stopPropagation(); }, {passive:true});
        var cmpDrag = false;
        function cmpFromEvent(ev){
          var r = box.getBoundingClientRect();
          setCmp((ev.clientX - r.left) / r.width * 100);
        }
        box.addEventListener("pointerdown", function(ev){ cmpDrag = true; try{ box.setPointerCapture(ev.pointerId); }catch(e){} cmpFromEvent(ev); });
        box.addEventListener("pointermove", function(ev){ if(cmpDrag) cmpFromEvent(ev); });
        box.addEventListener("pointerup", function(){ cmpDrag = false; });
        box.addEventListener("pointercancel", function(){ cmpDrag = false; });
        setCmp(50);
      } else if(s.tipo === "Completar"){

        }
      } else if(s.tipo === "Mapa mental"){

            ms.open[ri] = opening;
            b.querySelector(".marr").textContent = opening ? "▾ aberto" : "▸ tocar";
            if(opening && !ms.seen[ri]){
              ms.seen[ri] = true; ms.count++;
              var mc = document.getElementById("mindCount");
              if(mc) mc.textContent = ms.count + " de " + s.ramos.length;
            }
          });
        });
      } else if(s.tipo === "Desafio"){
        var dst = state[idx];
        var dArea = document.getElementById("desafioArea");
        var dLetters = ["A","B","C","D","E"];
        var maxPts = 0;
        s.perguntas.forEach(function(pq){ maxPts += (pq.pts || 100); });
        function renderDesafio(){
          if(dst.finished){
            var msg = dst.pts >= maxPts ? "Pontuação máxima! Você dominou esta aula do início ao fim." : dst.pts >= maxPts * 0.6 ? "Muito bem! Os conceitos principais desta aula já estão na sua mão." : "Bom começo! Refaça as questões e os flashcards da aula e tente de novo: o placar sobe rápido.";
            dArea.innerHTML = '<div class="finalscore"><p>SEU PLACAR FINAL</p><p class="big">' + dst.pts + ' pontos</p><p>' + msg + '</p><button class="againbtn" type="button" id="desafioAgain">Jogar de novo</button></div>';
            document.getElementById("desafioAgain").addEventListener("click", function(){
              dst.q = 0; dst.pts = 0; dst.answered = false; dst.chosen = null; dst.finished = false;
              renderDesafio();
            });
            return;
          }
          var pq = s.perguntas[dst.q];
          var val = pq.pts || 100;
          var h = '<div class="scorebar"><span>Pergunta <b>' + (dst.q + 1) + ' de ' + s.perguntas.length + '</b></span><span class="pts">' + dst.pts + ' pts</span></div>';
          if(pq.ouro) h += '<p><span class="goldtag">PERGUNTA DE OURO · VALE 200 PONTOS</span></p>';
          h += '<p class="qtext">' + pq.q + '</p>';
          pq.ops.forEach(function(op, oi){
            var cls = "opt";
            if(dst.answered){
              if(oi === pq.certa) cls += " correct";
              else if(oi === dst.chosen) cls += " wrong";
            }
            h += '<button class="' + cls + '" type="button" data-dopt="' + oi + '"' + (dst.answered ? ' disabled' : '') + '><span class="letter">' + dLetters[oi] + '</span><span>' + op + '</span></button>';
          });
          if(dst.answered){
            h += '<div class="feedback show ' + (dst.chosen === pq.certa ? 'good' : 'bad') + '"><b>' + (dst.chosen === pq.certa ? ("Resposta certa! +" + val + " pontos") : "Não foi dessa vez.") + '</b>' + pq.exp + '</div>';
            h += '<button class="againbtn" type="button" id="desafioNext" style="width:100%">' + (dst.q === s.perguntas.length - 1 ? "Ver meu placar" : "Próxima pergunta →") + '</button>';
          }
          dArea.innerHTML = h;
          dArea.querySelectorAll(".opt").forEach(function(o){
            o.addEventListener("click", function(){
              if(dst.answered) return;
              var oi = parseInt(o.getAttribute("data-dopt"), 10);
              dst.answered = true;
              dst.chosen = oi;
              if(oi === pq.certa) dst.pts += val;
              renderDesafio();
            });
          });
          var nb2 = document.getElementById("desafioNext");
          if(nb2) nb2.addEventListener("click", function(){
            if(dst.q === s.perguntas.length - 1){ dst.finished = true; }
            else { dst.q++; dst.answered = false; dst.chosen = null; }
            renderDesafio();
          });
        }
        renderDesafio();
      }
    }

    var karaIdx = -1;
    function karaFracs(s){
      var totalChars = 0;
      s.frases.forEach(function(f){ totalChars += f.length; });
      var acc = 0, fr = [];
      s.frases.forEach(function(f){
        fr.push([acc / totalChars, (acc + f.length) / totalChars]);
        acc += f.length;
      });
      return fr;
    }
    function karaSync(){
      var s = SLIDES[idx];
      if(!s || s.tipo !== "Karaokê" || !player.duration) return;
      var box = document.getElementById("karaokeBox");
      if(!box) return;
      var fr = karaFracs(s);
      var pos = player.currentTime / player.duration;
      var cur = 0;
      for(var i = 0; i < fr.length; i++){ if(pos >= fr[i][0]) cur = i; }
      if(cur === karaIdx) return;
      karaIdx = cur;
      var spans = box.querySelectorAll(".sent");
      spans.forEach(function(sp, si){
        sp.classList.toggle("on", si === cur);
        sp.classList.toggle("done", si < cur);
      });
      var el = spans[cur];
      if(el) el.scrollIntoView({behavior:"smooth", block:"nearest"});
    }
    function karaSeek(fi){
      var s = SLIDES[idx];
      if(!s || s.tipo !== "Karaokê" || !player.duration) return;
      var fr = karaFracs(s);
      player.currentTime = Math.max(0, fr[fi][0] * player.duration - 0.05);
      karaIdx = -1;
      karaSync();
      unlocked = true;
      tryPlay();
    }

    var BLOCKS = [[6, "Bloco 1 de 5 · O que são fontes"], [12, "Bloco 2 de 5 · Formais, autônomas e heterônomas"], [21, "Bloco 3 de 5 · Os dois grandes grupos formais"], [28, "Bloco 4 de 5 · Do fato social à regra"], [37, "Bloco 5 de 5 · Revisão e desafio"], [38, "Fechamento"]];
    function blockLabel(i){
      for(var b = 0; b < BLOCKS.length; b++){ if(i <= BLOCKS[b][0]) return BLOCKS[b][1]; }
      return "Fechamento";
    }

    function show(i, autoplay){
      idx = Math.max(0, Math.min(total - 1, i));
      var s = SLIDES[idx];
      karaIdx = -1;
      scrollArea.innerHTML = slideHTML(s);
      scrollArea.scrollTop = 0;
      scrollArea.classList.remove("enter");
      void scrollArea.offsetWidth;
      scrollArea.classList.add("enter");
      var h1El = document.querySelector("header h1");
      if(h1El) h1El.style.display = idx === 0 ? "none" : "";
      var seal = document.getElementById("blockSeal");
      if(seal) seal.textContent = blockLabel(idx);
      etapaLabel.innerHTML = "Etapa <b>" + (idx + 1) + " de " + total + "</b> · " + s.tipo + (s.titulo ? ": " + s.titulo : "");
      progressFill.style.width = ((idx + 1) / total * 100) + "%";
      btnPrev.disabled = idx === 0;
      btnNext.innerHTML = idx === total - 1 ? "↺ Voltar ao início" : "Próximo →";
      bindInteractions(s);
      player.pause();
      player.src = audioSrc(idx);
      player.load();
      if(autoplay && unlocked){ tryPlay(); }
    }

    btnPrev.addEventListener("click", function(){ show(idx - 1, true); });
    btnNext.addEventListener("click", function(){
      if(idx === total - 1){ show(0, true); } else { show(idx + 1, true); }
    });
    document.addEventListener("keydown", function(ev){
      if(ev.key === "ArrowRight"){ btnNext.click(); }
      else if(ev.key === "ArrowLeft"){ btnPrev.click(); }
    });
    document.addEventListener("pointerdown", function(){
      if(!unlocked){
        unlocked = true;
        if(player.paused){ tryPlay(); }
      }
    }, {once:false});

    var tx = null, ty = null;
    var phone = document.getElementById("phone");
    phone.addEventListener("touchstart", function(ev){
      tx = ev.touches[0].clientX; ty = ev.touches[0].clientY;
    }, {passive:true});
    phone.addEventListener("touchend", function(ev){
      if(tx === null) return;
      var dx = ev.changedTouches[0].clientX - tx;
      var dy = ev.changedTouches[0].clientY - ty;
      if(Math.abs(dx) > 64 && Math.abs(dx) > Math.abs(dy) * 1.7){
        if(dx < 0){ btnNext.click(); } else { btnPrev.click(); }
      }
      tx = null; ty = null;
    }, {passive:true});

    bindAudio();
    show(0, false);
    </script>
  </body>
</html>
