apply plugin: 'com.android.application'

android {
    namespace = "br.com.app.gpu2675756.gpu0e7509bfb7bde52aef412888bb17a456"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "br.com.app.gpu2675756.gpu0e7509bfb7bde52aef412888bb17a456"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
        // ─── GOOGLE PLAY CONSOLE: Divisões de densidade ───────────────────────
        // Ativa divisões por densidade no App Bundle para reduzir uso de memória
        // e evitar escalonamento de imagens em tempo real pelo sistema.
        // Dispositivos só baixam os recursos adaptados à sua densidade de tela.
        // Referência: https://developer.android.com/guide/app-bundle/configure-base#density-splits
        bundle {
            density {
                enableSplit true
            }
            abi {
                enableSplit true
            }
            language {
                enableSplit false
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // ─── GOOGLE PLAY CONSOLE: Otimização do R8 ────────────────────────
            // Usa o arquivo de otimização completo do Android para ativar R8 full mode,
            // reduzindo o tamanho do app e melhorando o desempenho em runtime.
            // Referência: https://developer.android.com/build/shrink-code#optimization
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // ─── GOOGLE PLAY CONSOLE: Redução de resolução de bitmap ──────────────────
    // Limita a densidade máxima de recursos drawable a xxxhdpi (640dpi).
    // Isso evita que dispositivos de menor resolução baixem e escalonem bitmaps
    // muito grandes, reduzindo consumo de memória e acelerando o carregamento.
    // Referência: https://developer.android.com/studio/build/configure-apk-splits#configure-density-split
    splits {
        density {
            enable true
            exclude "ldpi", "mdpi"
            compatibleScreens 'small', 'normal', 'large', 'xlarge'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
